h+=`<section class='hero rise'><p class='eyebrow'>${nm}님을 닮은 신</p><div class='port wake'>${godArt(G.k,240)}</div><p class='grk' style='margin:1rem 0 0;font-size:15px'>${G.gr}</p><h1 class='gname'>${G.n}</h1><p class='sm' style='margin:0'>로마 이름 ${G.ro} · ${G.ep}</p><p class='disp' style='font-size:19px;margin:.6rem 0 .8rem'>${G.role}</p><div><span class='chip' style='background:var(--bg-accent);color:var(--gold-ink)'>닮은 정도 ${R0(g0.F.T)}%</span><span class='chip'>상징 · ${G.sym}</span><span class='chip' style='background:var(--bg-${relL[1]});color:var(--text-${relL[1]})'>신탁 신뢰도 ${R0(R.rel)} · ${relL[0]}</span>${G.k=='medusa'?`<span class='chip' style='background:var(--bg-success);color:var(--text-success)'><i class='ti ti-eye'></i> 숨겨진 결과 · 유일한 괴물</span>`:''}${S.creator?`<span class='chip' style='background:#eef4ea;color:var(--tea)'><i class='ti ti-leaf'></i> 녹차의 신 본인 인증</span>`:''}</div><p class='lead' style='text-align:left;margin:1.2rem 0 .4rem;color:var(--ink2)'>${G.desc}</p></section>
<div class='card'><details><summary><i class='ti ti-scroll'></i> ${G.n}의 신화 읽기</summary><p class='mut' style='margin:.6rem 0 0'>${G.myth}</p></details></div>`;
if(F[0].F.T-F[1].F.T<3)h+=`<div class='card' style='background:#fffaf0!important;font-size:14px;line-height:1.65;color:var(--gold-ink)'>공동 신탁 · ${G.n}와(과) ${F[1].j.n}의 차이가 ${(F[0].F.T-F[1].F.T).toFixed(1)}점으로 측정 오차 안에 있어요. 당신 안에는 두 신이 함께 살고 있습니다.</div>`;
h+=`<div class='card' style='display:flex;gap:14px;align-items:center'><div style='flex:none'>${mascot('wink',60)}</div><div style='min-width:0'><p class='sm' style='margin:0;color:var(--tea);font-weight:700'>진우주가 지어 준 호메로스식 이름</p><p class='serif' style='font-size:17px;line-height:1.7;margin:2px 0 0'>“나는 ${EPI[top]||'빛나는'} ${nm}, ${G.n}의 결을 타고난 ${title}. ${ANI[ao[0]]}, ${HSTR[top]}.”</p></div></div>`;
h+=`<p class='disp' style='font-size:20px;margin:2rem 0 .7rem'>당신 안에 함께 사는 신들</p><div class='g2'>${F.slice(1,3).map((o,i)=>`<div class='card' style='margin:0;display:flex;gap:12px;align-items:center'><div style='flex:none'>${godArt(o.j.k,72)}</div><div><p class='sm' style='margin:0;color:var(--gold-ink);font-weight:600'>${i+2}위 · ${R0(o.F.T)}%</p><p class='disp' style='font-size:19px;margin:0'>${o.j.n}</p><p class='sm' style='margin:2px 0 0'>${X.why(o.j)}</p></div></div>`).join('')}</div>`;
const NAV=[...(S.prev?[['s-cmp','지난 신탁']]:[]),['s-char','신성 카드'],['s-core','영혼의 결'],['s-god','판테온'],['s-rel','관계도'],['s-quest','과업'],['s-fate','운명의 저울'],['s-oracle','델포이 신탁'],['s-fun','다른 세계'],['s-pat','응답 패턴'],...(S.preview==null?[['s-crew','원정대']]:[]),['s-code','결과 코드']];
h+=`<nav class='snav' aria-label='결과 목차'>${NAV.map(([id,l])=>`<button data-go='${id}'>${l}</button>`).join('')}</nav>`;return h}
function jo(s){const M={'을(를)':['를','을'],'이(가)':['가','이'],'은(는)':['는','은'],'와(과)':['와','과'],'과(와)':['와','과']};return String(s).replace(new RegExp('([가-힣])(을[(]를[)]|이[(]가[)]|은[(]는[)]|와[(]과[)]|과[(]와[)])','g'),(m,c,p)=>c+M[p][(c.charCodeAt(0)-44032)%28>0?1:0])}
