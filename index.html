<!doctype html>
<html lang='ko'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<meta property='og:title' content='몬BTI · 진우주의 할로윈 몬스터 감별소'>
<meta property='og:description' content='녹차 귀신 진우주와 함께 30개의 갈림길을 지나면 내 안의 할로윈 몬스터를 찾아 줘요!'>
<title>몬BTI · 진우주의 할로윈 몬스터 감별소</title>
<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Press+Start+2P&display=swap'>
<style>
:root{
  --bg1:#2b2357; --bg2:#43367f; --bg3:#5d4aa3; --line:#2b2440; --sh:#ff9fb8; --sh2:#b79cff;
  --paper:#fffaf2; --cream:#fff1de; --ink:#2b2440; --ink-2:#6a6188; --light:#fff6ff; --light-2:#d9cdfa;
  --pump:#ff9a3c; --pump-d:#e0731c; --btn:#ff8a3d; --purple:#a98cf0; --purple-d:#7356c9; --moon:#ffe58a;
  --pink:#ff8ab8; --pink-l:#ffe3ee; --mint:#c9f2d8; --matcha:#a8d88a; --matcha-d:#4f9a45;
  --f-disp:'Jua','Gowun Dodum','Apple SD Gothic Neo',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --f-pix:'Press Start 2P',ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{background:var(--bg1)}
body{margin:0;color:var(--light);font-family:var(--f-body);font-size:16px;line-height:1.65;min-height:100vh;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.22) 0 1.5px,transparent 2.5px) 0 0/70px 70px,
    radial-gradient(circle at 60% 70%,rgba(255,229,138,.28) 0 1.5px,transparent 2.5px) 0 0/110px 110px,
    linear-gradient(180deg,var(--bg1) 0,var(--bg2) 520px,var(--bg3) 100%);
  background-color:var(--bg3);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:720px;margin:0 auto;padding-block:22px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--moon);outline-offset:3px}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}

.intro{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.eyebrow{font-family:var(--f-pix);font-size:9px;letter-spacing:.08em;color:var(--moon)}
.title{font-size:clamp(46px,12vw,80px);line-height:1.05;color:var(--light);text-shadow:4px 4px 0 var(--purple-d),7px 7px 0 var(--line)}
.title em{display:inline-block;font-style:normal;color:var(--pump);font-size:.56em;text-shadow:3px 3px 0 var(--line);animation:bob 2.6s ease-in-out infinite}
.host{display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px}
.cast{width:100%;image-rendering:pixelated;border:3px solid var(--line);border-radius:18px;background:var(--bg2);box-shadow:5px 5px 0 var(--sh)}
.say{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;box-shadow:5px 5px 0 var(--sh2);animation:pop .5s ease-out}
.say::before{content:'';position:absolute;top:-11px;left:calc(50% - 9px);width:14px;height:14px;background:var(--paper);border-left:3px solid var(--line);border-top:3px solid var(--line);transform:rotate(45deg)}
.say b{display:block;font-family:var(--f-disp);font-weight:400;font-size:18px;color:var(--matcha-d);margin-bottom:2px}
.say strong{color:var(--matcha-d)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:560px}
.rules div{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:10px 8px;font-size:13px;color:var(--ink-2);box-shadow:3px 3px 0 var(--sh2)}
.rules b{display:block;font-family:var(--f-pix);font-size:14px;font-weight:400;color:var(--pump-d);margin-bottom:4px}
.btn{border:3px solid var(--line);border-radius:999px;padding:12px 28px;font-family:var(--f-disp);font-size:21px;background:var(--btn);color:#fff;box-shadow:4px 4px 0 var(--line);transition:transform .08s,box-shadow .08s;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:var(--paper);color:var(--ink);text-shadow:none}
.btn.mint{background:var(--matcha-d)}

.hud{display:flex;align-items:center;gap:12px}
.hud .no{font-family:var(--f-disp);font-size:22px;white-space:nowrap;color:var(--light)}
.hud .no small{font-family:var(--f-pix);font-size:10px;color:var(--light-2);margin-left:6px}
.pips{flex:1;display:grid;grid-template-columns:repeat(30,1fr);gap:2px;min-width:0}
.pips i{height:9px;background:#4a3d86;border:1px solid #6e5fb0;border-radius:4px}
.pips i.done{background:var(--matcha);border-color:var(--matcha-d)}
.pips i.gate{border-color:var(--moon)}
.qcard{background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:4px 4px 0 var(--sh);display:flex;gap:12px;align-items:center}
.qav{flex:none;width:52px;height:52px;image-rendering:pixelated;background:var(--mint);border:2.5px solid var(--line);border-radius:50%;animation:bob 2.2s ease-in-out infinite}
.qwho{display:inline-block;font-family:var(--f-disp);font-size:13px;color:#fff;background:var(--matcha-d);border-radius:999px;padding:0 10px;margin-bottom:3px}
.qcard p{font-size:18px;line-height:1.45;font-family:var(--f-disp)}

.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:18px;overflow:hidden;border:3px solid var(--line);box-shadow:5px 5px 0 var(--sh2);background:var(--bg1)}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.bubble{position:absolute;top:3%;width:41%;padding:8px 10px 10px;border:2.5px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);text-align:left;
  font-family:var(--f-body);font-size:clamp(12px,2.6vw,15px);line-height:1.4;box-shadow:3px 3px 0 rgba(43,36,64,.5);transition:transform .15s,background .15s}
.bubble::after{content:'';position:absolute;bottom:-9px;left:calc(50% - 8px);width:12px;height:12px;background:inherit;border-right:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:rotate(45deg)}
.bubble.l{left:2%}.bubble.r{right:2%}
.bubble .tag{display:inline-block;font-family:var(--f-disp);font-size:13px;color:#fff;border-radius:999px;padding:0 9px;margin-bottom:3px}
.bubble.l .tag{background:var(--pump-d)}.bubble.r .tag{background:var(--purple-d)}
.bubble.hot{transform:translateY(-3px) scale(1.04)}
.bubble.l.hot{background:#fff0de}.bubble.r.hot{background:#f1eaff}
.bubble[disabled]{cursor:default}
.minibox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(43,35,87,.92);color:var(--light);text-align:center;padding:16px}
.minibox h2{font-size:clamp(26px,6.5vw,36px);color:var(--moon)}
.minibox p{max-width:26em;font-size:14px}
.minibox .note{font-size:12px;color:var(--light-2)}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mhud{position:absolute;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;font-family:var(--f-disp);font-size:clamp(13px,3vw,16px);pointer-events:none}
.mhud span{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:0 10px}
.pad{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.pad button{min-width:84px;height:56px;border-radius:18px;border:3px solid var(--line);background:var(--paper);color:var(--ink);font-family:var(--f-pix);font-size:16px;box-shadow:3px 3px 0 var(--sh2);touch-action:none;user-select:none;-webkit-user-select:none}
.pad button.on,.pad button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh2)}
.pad .act{background:var(--moon);font-family:var(--f-disp);font-size:20px}
.hint{text-align:center;font-size:14px;color:var(--light-2);min-height:1.5em}
.hint b{color:var(--matcha);font-weight:400;font-family:var(--f-disp)}

.res{display:flex;flex-direction:column;gap:18px}
.res > *{animation:pop .45s ease-out both}
.hero{position:relative;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:22px;padding:18px;box-shadow:6px 6px 0 var(--sh)}
.hero .eyebrow{color:var(--matcha-d)}
.portrait{width:176px;height:132px;image-rendering:pixelated;border-radius:18px;border:3px solid var(--line);background:linear-gradient(180deg,#cbb8f5,#f3c9e0);animation:bob 2.4s ease-in-out infinite}
.meta{min-width:0;display:flex;flex-direction:column;gap:6px}
.code{font-family:var(--f-pix);font-size:clamp(20px,5.5vw,30px);color:var(--pump-d)}
.breed{font-size:clamp(34px,8.5vw,48px);line-height:1.05}
.breed small{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink-2);margin-top:4px}
.nick{font-family:var(--f-disp);font-size:19px;color:var(--purple-d)}
.quote{font-size:14px;background:var(--pink-l);border:2px dashed var(--pink);border-radius:12px;padding:6px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:13px;padding:2px 10px;border-radius:999px;border:2px solid var(--line);background:var(--cream);color:var(--ink)}

.panel{background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 var(--sh2)}
.panel:nth-of-type(even){box-shadow:6px 6px 0 var(--sh)}
.panel h3{font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel h3 .k{font-family:var(--f-pix);font-size:9px;letter-spacing:.06em;color:var(--paper);background:var(--ink);padding:5px 7px 4px;border-radius:999px}
.panel .sub{font-size:14px;color:var(--ink-2)}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits span{background:var(--moon);border:2px solid var(--line);font-size:13px;padding:2px 12px;border-radius:999px}

.jw{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--mint);color:var(--ink);border:3px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:6px 6px 0 var(--matcha-d)}
.jw canvas{width:72px;height:72px;image-rendering:pixelated;animation:bob 2s ease-in-out infinite}
.jw b{display:block;font-family:var(--f-disp);font-weight:400;color:var(--matcha-d);font-size:16px}
.jw p{font-family:var(--f-disp);font-size:18px;line-height:1.45}

.stats{display:flex;flex-direction:column;gap:9px}
.stat{display:grid;grid-template-columns:6.4em 1fr 3.4em;gap:10px;align-items:center;font-size:14px}
.sbar{height:16px;background:#efe8fb;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--purple))}
.stat .n{font-family:var(--f-pix);font-size:10px;color:var(--purple-d);text-align:right}

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;position:relative}
.tl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:15px}
.tl .tm{font-family:var(--f-pix);font-size:10px;color:#fff;background:var(--purple-d);border:2px solid var(--line);border-radius:999px;padding:5px 8px 4px}
.tl li:nth-child(3) .tm{background:var(--pump-d)}.tl li:nth-child(4) .tm{background:var(--ink)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2.5px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--cream);min-width:0}
.tile .h{font-family:var(--f-disp);font-size:14px;color:var(--ink-2)}
.tile .v{font-family:var(--f-disp);font-size:18px;line-height:1.3}
.tile p{font-size:13px;color:var(--ink-2);margin-top:2px}
.tile.sk{background:#fff0de}.tile.wk{background:#f1eaff}.tile.sn{background:var(--pink-l)}.tile.it{background:var(--mint)}

.axes{display:flex;flex-direction:column;gap:10px}
.axis{display:grid;grid-template-columns:4.6em 1fr 4.6em;gap:8px;align-items:center;font-size:13px}
.axis .a{text-align:right}
.axis .on{color:var(--pump-d);font-weight:700}
.bar{position:relative;height:14px;background:#efe8fb;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--pump)}
.bar::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);opacity:.4}
.pc{display:flex;justify-content:space-between;font-family:var(--f-pix);font-size:8px;color:var(--ink-2);margin-top:3px}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mate{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:12px;border-radius:16px;border:2.5px solid var(--line);min-width:0}
.mate.good{background:#eafaf0}.mate.bad{background:#fff0f4}
.mate canvas{width:84px;height:63px;image-rendering:pixelated;border-radius:12px;border:2px solid var(--line);background:linear-gradient(180deg,#cbb8f5,#f3c9e0)}
.mate.bad canvas{background:linear-gradient(180deg,#ffc9a8,#ffb3c6)}
.mate .nm{font-family:var(--f-disp);font-size:19px;line-height:1.2}
.mate .cd{font-family:var(--f-pix);font-size:9px;color:var(--ink-2)}
.mate p{grid-column:1/-1;font-size:14px}
.badge{display:inline-block;font-family:var(--f-disp);font-size:13px;padding:0 9px;border-radius:999px;color:#fff;margin-bottom:2px}
.badge.g{background:var(--matcha-d)}.badge.b{background:#e0507a}
.owner{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border-radius:16px;border:2.5px solid var(--line);min-width:0}
.owner.good{background:#eef0ff}.owner.bad{background:#fbeef6}
.owner canvas{width:60px;height:96px;image-rendering:pixelated;border-radius:12px;border:2px solid var(--line);background:#d9cdfa}
.owner .nm{font-family:var(--f-disp);font-size:19px;line-height:1.25}
.owner .cd{font-family:var(--f-pix);font-size:10px;color:var(--purple-d)}
.owner p{font-size:14px;margin-top:4px}
.owner .tip{margin-top:8px;font-size:13px;background:var(--paper);border:2px dashed var(--ink-2);border-radius:10px;padding:6px 10px}
.alt .rk{font-family:var(--f-disp);font-size:14px;color:var(--pump-d)}

.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dex button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 8px;background:var(--cream);border:2px solid var(--line);border-radius:14px;color:var(--ink);font-family:var(--f-disp);font-size:13px;line-height:1.2;transition:transform .1s}
.dex button:hover{transform:translateY(-2px)}
.dex button canvas{width:56px;height:42px;image-rendering:pixelated}
.dex button small{font-family:var(--f-pix);font-size:7px;color:var(--ink-2)}
.dex button.me{background:var(--moon);box-shadow:0 0 0 3px var(--pump) inset}
.dex button.sel{background:var(--mint)}
.dexview{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#f6f1ff;border:2.5px dashed var(--purple);border-radius:16px;padding:12px;min-height:80px}
.dexview canvas{width:96px;height:72px;image-rendering:pixelated;border-radius:12px;border:2px solid var(--line);background:linear-gradient(180deg,#cbb8f5,#f3c9e0)}
.dexview .nm{font-family:var(--f-disp);font-size:20px}
.dexview .ni{font-family:var(--f-disp);font-size:14px;color:var(--purple-d)}
.dexview p{font-size:13px;margin-top:4px}
.cardimg{width:100%;max-width:360px;align-self:center;border-radius:18px;border:3px solid var(--line)}
.share{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.toast{text-align:center;font-size:13px;color:var(--matcha-d);min-height:1.2em}
.urlbox{width:100%;font-size:12px;background:var(--cream);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px}
.foot{height:16px;background:repeating-linear-gradient(90deg,var(--pump) 0 12px,var(--bg1) 12px 15px,var(--matcha) 15px 27px,var(--bg1) 27px 30px,var(--purple) 30px 42px,var(--bg1) 42px 45px);border-radius:999px;border:2px solid var(--line)}
@media (max-width:540px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}.chips{justify-content:center}
  .pair,.tiles{grid-template-columns:1fr}.rules{grid-template-columns:1fr}.qcard p{font-size:16px}
  .dex{grid-template-columns:repeat(4,1fr)}.dex button{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class='wrap'>
  <section id='intro' class='intro'>
    <span class='eyebrow'>HALLOWEEN MONSTER LAB · 16 TYPES</span>
    <h1 class='title'>몬BTI<br><em>할로윈 몬스터 감별소</em></h1>
    <div class='host'>
      <canvas id='cast' class='cast' width='200' height='60' aria-label='녹차 귀신 진우주와 몬스터 친구들 픽셀 그림'></canvas>
      <div class='say'><b>🍵 녹차 귀신 진우주</b>안녕! 난 녹차밭에 사는 귀신 <strong>진우주</strong>야. 할로윈 밤에는 누구나 몬스터가 된대. 나랑 같이 30개의 갈림길을 지나면, 네 안에 꼭꼭 숨어 있는 몬스터를 찾아 줄게!</div>
    </div>
    <div class='rules'>
      <div><b>30</b>진우주를 움직여 마음에 드는 답의 파티장으로 입장</div>
      <div><b>3</b>10문항마다 쉬어 가는 미니 게임 (결과와 무관)</div>
      <div><b>16</b>몬스터 도감 · 능력치 · 할로윈 밤 루틴 · 결과 카드</div>
    </div>
    <button class='btn' id='start'>진우주랑 할로윈 밤 시작 🎃</button>
  </section>

  <section id='play' hidden>
    <div class='hud'><div class='no' id='qno'></div><div class='pips' id='pips' aria-hidden='true'></div></div>
    <div class='qcard'><canvas id='qav' class='qav' width='16' height='16' aria-hidden='true'></canvas><div><span class='qwho' id='qpaw'>진우주의 질문</span><p id='qtext'></p></div></div>
    <div class='stage'>
      <canvas id='cv' width='160' height='120'></canvas>
      <button class='bubble l' id='optL'></button>
      <button class='bubble r' id='optR'></button>
      <div class='mhud' id='mhud' hidden><span id='mLeft'></span><span id='mRight'></span></div>
      <div class='minibox' id='minibox' hidden></div>
    </div>
    <div class='pad'>
      <button id='btnL' aria-label='왼쪽으로'>◀</button>
      <button id='btnAct' class='act' hidden></button>
      <button id='btnR' aria-label='오른쪽으로'>▶</button>
    </div>
    <p class='hint' id='hint'></p>
  </section>

  <section id='result' class='res' hidden></section>
  <div class='foot' aria-hidden='true'></div>
</div>

<script>

G.drawSpr=function(ctx,cx,feet,s,face,alpha,bob,scale){

  ctx.restore();
};

  update(dt){ const s=this.s; s.t+=dt; s.mt-=dt; s.dash=Math.max(0,s.dash-dt);
    if(s.phase==='wait'){ s.word=(s.fake && s.t>s.fakeAt && s.t<s.fakeAt+0.6) ? ['와플!','왁스!','악어!'][s.round%3] : '쉿…'; if(s.t>=s.dur){ s.phase='go'; s.t=0; s.word='왁!'; } }
    else if(s.phase==='go'){ if(s.t>1.1){ s.msg='사람이 지나가 버렸어…'; s.mt=1; s.phase='res'; s.t=0; } }
    else if(s.phase==='res'){ if(s.t>1.1){ s.round++; if(s.round>=6) this.done=true; else this.next(); } } },
  draw(ctx,t){ const s=this.s;
    G.drawSpr(ctx,30,G.FEET,G.SPR.INFJ,1,1,s.phase==='go'?Math.floor(t*12)%2:0);
    const scared=s.dash>0, hy=scared?Math.round(-Math.sin((0.5-s.dash)/0.5*Math.PI)*6):0;
    G.drawOwner(ctx,128,G.FEET-16+hy,'ESFJ');
    G.drawSpr(ctx,100,scared?G.FEET-20:G.FEET-9,G.JWJ,1,1,0);
    ctx.fillStyle='#2b2440'; ctx.fillRect(91,95,19,17); ctx.fillRect(93,93,15,2);
    ctx.fillStyle='#d9cdfa'; ctx.fillRect(92,96,17,15); ctx.fillRect(94,94,13,2);
    ctx.fillStyle='#a898d8'; ctx.fillRect(100,98,1,8); ctx.fillRect(97,100,7,1); ctx.fillRect(92,110,17,1);
    if(s.phase!=='res'){ const go=s.phase==='go', w=go?30:40; ctx.fillStyle='#2b2440'; ctx.fillRect(10,76,w+2,16); ctx.fillStyle=go?'#ffd65a':'#fffaf2'; ctx.fillRect(11,77,w,14); ctx.fillRect(26,91,4,3);
      ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillStyle=go?'#e0405a':'#2b2440'; ctx.fillText(s.word,11+w/2,87); }
    if(scared) label(ctx,'으악!',134,84,'#ffd65a');
    if(s.mt>0) label(ctx,s.msg,80,58,s.msg.indexOf('성공')>=0?'#c9f2d8':'#ffb3c6'); },
  hud(){ return ['도전 '+Math.min(this.s.round+1,6)+' / 6','성공 '+this.s.score]; },
  end(){ const n=this.s.score, b=this.s.best; return {score:n+' / 6 성공!', line:(b!=null?'최고 반응 속도 '+b+'ms. ':'')+(n>=5?'진우주: 마을 최고의 놀래키기 장인 인정! 👻':n>=3?'진우주: 제법 으스스했어, 나도 깜짝 놀랐다구!':'진우주: 오히려 네가 더 놀란 것 같은데…? 🍵')}; }
},
{ title:'도깨비불 잡기', icon:'🔥',
  desc:'공동묘지 위로 알록달록 도깨비불이 둥실둥실 날아가! 좌우로 움직이고 ‘점프’ 버튼(또는 스페이스)으로 뛰어올라 잡아 줘. 20초 동안 이어져.',
  label:'점프', move:true,
  init(){ this.s={t:20,wisps:[],sp:0.4,score:0,vy:0,air:false}; this.pc={x:80,y:G.FEET,face:1,frame:0,ft:0}; this.done=false; },
  act(){ const s=this.s; if(s.air)return; s.air=true; s.vy=-125; },
  update(dt,inp){ const s=this.s, pc=this.pc; s.t-=dt; if(s.t<=0){s.t=0;this.done=true;return;}
    walk(pc,inp,dt,80);
    if(s.air){ s.vy+=340*dt; pc.y+=s.vy*dt; pc.frame=1; if(pc.y>=G.FEET){pc.y=G.FEET;s.air=false;} }
    s.sp-=dt; if(s.sp<=0){ s.sp=1.1-0.45*(1-s.t/20); const L=Math.random()<0.5;
      s.wisps.push({x:L?-6:166,vx:(L?1:-1)*(38+Math.random()*26+(20-s.t)*1.2),y0:76+Math.random()*16,ph:Math.random()*6,c:['#7ad7ff','#b8e39a','#ff8ab8','#c9a8ff'][Math.floor(Math.random()*4)]}); }
    const hx=pc.x+pc.face*5, hy=pc.y-8;
    s.wisps=s.wisps.filter(d=>{ d.x+=d.vx*dt; d.ph+=dt*4; d.y=d.y0+Math.sin(d.ph)*3;
      if(Math.abs(d.x-hx)<8&&Math.abs(d.y-hy)<7){ s.score++; G.puff(d.x,d.y,12,[d.c,'#ffffff']); return false; }
      return d.x>-10&&d.x<170; }); },
  draw(ctx,t){ const s=this.s;
    s.wisps.forEach(d=>{ const x=Math.round(d.x),y=Math.round(d.y), fl=Math.floor(t*10+d.ph)%2;
      ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(x-4,y-6,9,10);
      ctx.fillStyle=d.c; ctx.fillRect(x-2,y-1,5,3); ctx.fillRect(x-1,y-3,3,2); ctx.fillRect(fl?x:x+1,y-5,1,2);
      ctx.fillStyle='#2b2440'; ctx.fillRect(x-1,y,1,1); ctx.fillRect(x+1,y,1,1); });
    drawJW(ctx,this.pc,t,false); },
  hud(){ return ['🔥 도깨비불 '+this.s.score+'개','⏱ '+Math.ceil(this.s.t)+'초']; },
  end(){ const n=this.s.score; return {score:'도깨비불 '+n+'개!', line:n>=12?'진우주: 도깨비도 인정한 점프 실력이야! 🔥':n>=6?'진우주: 공동묘지의 인기 스타 탄생~':'진우주: 도깨비불이 머리 위로 휙휙… 괜찮아, 결과엔 안 들어가!'}; }
}
];
})();

<script>
(function(){
const G=window.G, Q=window.QUESTIONS, T=window.TYPES, REACTS=window.REACTS;
const SHARE_URL='';   // 웹에 올린 주소를 넣으면 공유 링크가 그 주소로 만들어져요
const CODES=Object.keys(T);
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const BG=G.buildBG();
let mode='intro', idx=0, ans=[], mini=null, miniN=0, enterT=0, enterSide=null, react='';
const pc={x:80,y:G.FEET,face:1,frame:0,ft:0,alpha:1,target:null};
const inp={l:false,r:false};

const pips=$('pips'); for(let i=0;i<30;i++){const e=document.createElement('i'); if(i%10===9)e.className='gate'; pips.appendChild(e);}
const setPips=()=>[...pips.children].forEach((e,i)=>e.classList.toggle('done',i<idx));
G.drawSpr($('qav').getContext('2d'),8,15,G.JWJ,1,1,0);

// 인트로: 진우주와 친구들
const cast=$('cast'), cc=cast.getContext('2d');
const CAST=[['ENFJ',24],['ISFP',64],['INFJ',136],['ESFP',176]];
function drawCast(t){
  cc.fillStyle='#43367f'; cc.fillRect(0,0,200,60);
  for(let i=0;i<26;i++){ cc.fillStyle=(Math.floor(t*2+i)%4)?'rgba(255,246,208,0.55)':'#ffe58a'; cc.fillRect((i*37+5)%200,(i*13+3)%40,1,1); }
  G.moon(cc,184,12,6);
  cc.fillStyle='#6fbf9a'; cc.fillRect(0,48,200,12); cc.fillStyle='#f3d3a8'; cc.fillRect(0,52,200,6); cc.fillStyle='#d9b07c'; cc.fillRect(0,52,200,1);
  CAST.forEach(([k,x],i)=>{ const hop=Math.round(Math.max(0,Math.sin(t*4+i*1.3))*1.5);
    cc.fillStyle='rgba(43,36,64,0.25)'; cc.fillRect(x-10,55,21,2);
    G.drawSpr(cc,x,55,G.SPR[k],x<100?1:-1,1,hop,2); });
  const fy=Math.round(Math.sin(t*2.5)*2);
  cc.fillStyle='rgba(43,36,64,0.25)'; cc.fillRect(86,56,29,2);
  G.drawSpr(cc,100,53+fy,G.JWJ,1,1,0,3);
}

function setBubble(el,tag,txt){ el.innerHTML=''; const s=document.createElement('span'); s.className='tag'; s.textContent=tag; el.appendChild(s); el.appendChild(document.createElement('br')); el.appendChild(document.createTextNode(txt)); }
function showQ(){
  mode='quiz'; const q=Q[idx];
  $('qno').innerHTML='Q'+(idx+1)+'<small>/ 30</small>'; $('qpaw').textContent='진우주의 질문 Q'+(idx+1);
  $('qtext').textContent=q.q;
  setBubble($('optL'),'🎃 호박 파티장',q.a[0]); setBubble($('optR'),'👻 유령 저택 파티',q.b[0]);
  $('optL').hidden=$('optR').hidden=false; $('optL').disabled=$('optR').disabled=false;
  Object.assign(pc,{x:80,y:G.FEET,alpha:1,target:null,frame:0});
  G.puff(80,G.FEET-8,12,['#ffffff','#b8e39a','#ffd65a']);
  $('btnAct').hidden=true; $('btnL').hidden=$('btnR').hidden=false;
  if(idx<2||!react) $('hint').textContent='◀ ▶ 버튼이나 방향키로 진우주를 움직여 고른 답의 파티장으로 입장! 말풍선을 눌러도 둥실 날아가요.';
  else $('hint').innerHTML='<b>🍵 진우주</b> '+react;
  setPips();
}
function choose(c){ if(mode!=='quiz')return; ans[idx]=c; mode='enter'; enterT=0; enterSide=c; pc.target=null; inp.l=inp.r=false;
  $('optL').disabled=$('optR').disabled=true; react=REACTS[Math.floor(Math.random()*REACTS.length)]; G.puff(c==='a'?G.GL:G.GR,84,18,['#ff8ab8','#ffe58a','#b8e39a','#a98cf0','#7ad7ff']); }
function nextQ(){ idx++; setPips(); if(idx%10===0) startMini(idx/10-1); else showQ(); }

// 미니 게임
const box=$('minibox');
function startMini(n){
  miniN=n; mini=G.MINI[n]; mode='miniIntro';
  $('optL').hidden=$('optR').hidden=true; $('mhud').hidden=true;
  $('btnAct').hidden=true; $('btnL').hidden=$('btnR').hidden=true;
  $('qno').innerHTML='쉬는 시간<small>'+(n+1)+' / 3</small>'; $('qpaw').textContent='진우주의 쉬는 시간';
  $('qtext').textContent=(n===2?'30문항 완주! 결과 보기 전에 ':'10문항 통과! ')+'잠깐 놀다 가자. 게임 점수는 결과에 안 들어가니까 마음 편히!';
  $('hint').textContent='';
  box.innerHTML=`<h2>${mini.icon} ${mini.title}</h2><p>${mini.desc}</p><p class='note'>결과와 상관없는 놀이예요</p><div class='mrow'><button class='btn' id='mgo'>놀이 시작</button><button class='btn ghost' id='mskip'>건너뛰기</button></div>`;
  box.hidden=false;
  $('mgo').onclick=()=>{ mini.init(); box.hidden=true; $('mhud').hidden=false; mode='mini';
    $('btnAct').hidden=!mini.label; $('btnAct').textContent=mini.label||''; $('btnL').hidden=$('btnR').hidden=!mini.move;
    $('hint').textContent=mini.move?(mini.label?'◀ ▶로 움직이고 ‘'+mini.label+'’ 버튼이나 스페이스를 눌러요.':'◀ ▶ 버튼이나 방향키로 움직여요.'):'‘'+mini.label+'’ 버튼이나 스페이스를 눌러요.';
    $('mgo').blur(); };
  $('mskip').onclick=afterMini; $('mgo').focus({preventScroll:true});
}
function endMini(){ mode='miniEnd'; const r=mini.end(); $('mhud').hidden=true; inp.l=inp.r=false;
  box.innerHTML=`<h2>${r.score}</h2><p>${r.line}</p><p class='note'>이 점수는 결과에 들어가지 않아요</p><div class='mrow'><button class='btn' id='mnext'>${miniN===2?'두구두구… 결과 보러 가기':'다음 질문으로'}</button></div>`;
  box.hidden=false; $('mnext').onclick=afterMini; $('mnext').focus({preventScroll:true}); }
function afterMini(){ $('mhud').hidden=true; mini=null; G.parts=[]; $('btnAct').hidden=true; $('btnL').hidden=$('btnR').hidden=true;
  if(miniN===2){ mode='judge';
    box.innerHTML=`<h2>🍵 감별 중…</h2><p>진우주가 찻잎을 우리면서 너의 몬스터를 찾고 있어. 두구두구두구…</p>`; box.hidden=false;
    setTimeout(()=>{ box.hidden=true; showResult(compute()); },1500);
  } else { box.hidden=true; showQ(); } }

// 입력
function hold(btn,key){ const on=e=>{e.preventDefault();inp[key]=true;btn.classList.add('on');pc.target=null;}, off=()=>{inp[key]=false;btn.classList.remove('on');};
  btn.addEventListener('pointerdown',on); ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,off)); }
hold($('btnL'),'l'); hold($('btnR'),'r');
$('btnAct').addEventListener('pointerdown',e=>{e.preventDefault();doAct();});
function doAct(){ if(mode==='mini'&&mini&&mini.act) mini.act(); }
$('optL').onclick=()=>{ if(mode==='quiz') pc.target=G.GL-4; };
$('optR').onclick=()=>{ if(mode==='quiz') pc.target=G.GR+4; };
const playing=()=>mode==='quiz'||mode==='mini';
addEventListener('keydown',e=>{ if(!playing())return; const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){inp.l=true;pc.target=null;e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){inp.r=true;pc.target=null;e.preventDefault();}
  else if((k===' '||k==='ArrowUp')&&mode==='mini'){ if(!e.repeat) doAct(); e.preventDefault(); } });
addEventListener('keyup',e=>{ const k=e.key; if(k==='ArrowLeft'||k==='a'||k==='A')inp.l=false; if(k==='ArrowRight'||k==='d'||k==='D')inp.r=false; });

// 루프
function update(dt){
  G.updParts(dt);
  if(mode==='quiz'){
    let d=(inp.r?1:0)-(inp.l?1:0); if(pc.target!=null) d=Math.sign(pc.target-pc.x);
    pc.x=Math.max(10,Math.min(150,pc.x+d*70*dt));
    if(d){pc.face=d;pc.ft+=dt;pc.frame=[0,1,0,2][Math.floor(pc.ft*10)%4];}else pc.frame=0;
    $('optL').classList.toggle('hot',pc.x<62); $('optR').classList.toggle('hot',pc.x>98);
    if(pc.x<=G.GL+2) choose('a'); else if(pc.x>=G.GR-2) choose('b');
  } else if(mode==='enter'){
    enterT+=dt; const cx=enterSide==='a'?G.GL:G.GR; pc.x+=(cx-pc.x)*Math.min(1,dt*10);
    pc.y=G.FEET-enterT*26; pc.alpha=Math.max(0,1-enterT/0.5); pc.ft+=dt; pc.frame=[0,1,0,2][Math.floor(pc.ft*10)%4];
    if(enterT>0.62){ $('optL').classList.remove('hot'); $('optR').classList.remove('hot'); nextQ(); }
  } else if(mode==='mini'){ mini.update(dt,inp); if(mini.done) endMini(); else { const h=mini.hud(); $('mLeft').textContent=h[0]; $('mRight').textContent=h[1]; } }
}
function draw(t){
  if(mode==='intro'){ drawCast(t); return; }
  if(mode==='result') return;
  ctx.drawImage(BG,0,0); G.drawSky(ctx,t); G.drawFX(ctx,t);
  if(mode==='quiz'||mode==='enter'){
    [[G.GL,pc.x<62||(enterSide==='a'&&mode==='enter')],[G.GR,pc.x>98||(enterSide==='b'&&mode==='enter')]].forEach(([cx,on])=>{
      if(!on) return; ctx.fillStyle='rgba(255,229,138,'+(0.5+0.25*Math.sin(t*8)).toFixed(2)+')'; ctx.fillRect(cx-4,88,9,10); ctx.fillRect(cx-3,86,7,2);
      if(mode==='quiz'){ const by=Math.round(54+Math.sin(t*6)*1.5); ctx.fillStyle='#2b2440'; ctx.fillRect(cx-3,by-1,7,1); ctx.fillStyle='#ffd65a'; ctx.fillRect(cx-2,by,5,1); ctx.fillRect(cx-1,by+1,3,1); ctx.fillRect(cx,by+2,1,1); } });
    ctx.fillStyle='rgba(43,36,64,0.25)'; ctx.fillRect(Math.round(pc.x)-6,G.FEET,13,2);
    G.drawSpr(ctx,pc.x,pc.y-1+Math.round(Math.sin(t*4)),G.JWJ,pc.face,pc.alpha,pc.frame===1?1:0);
  } else if(mini && (mode==='mini'||mode==='miniEnd')) mini.draw(ctx,t);
  G.drawParts(ctx);
}
let last=performance.now();
function loop(now){ const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now; update(dt); draw(now/1000); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// 채점
const AX=[['E','I','외향','내향'],['S','N','감각','직관'],['T','F','사고','감정'],['J','P','계획','즉흥']];
function compute(){
  const sc={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  Q.forEach((q,i)=>{ const c=ans[i]; if(c) sc[q[c][1]]+=q.w||1; });
  const pct=AX.map(([a,b])=>{const tt=sc[a]+sc[b]; return tt?sc[a]/tt:0.5;});
  const all=[];
  for(const a of 'EI')for(const b of 'SN')for(const c of 'TF')for(const d of 'JP'){ const code=a+b+c+d;
    all.push({code,m:[...code].reduce((s,L,i)=>s+(L===AX[i][0]?pct[i]:1-pct[i]),0)/4}); }
  all.sort((x,y)=>y.m-x.m); return {pct,rank:all};
}
window.__compute=compute;

// 결과
const esc=s=>String(s).replace(/[&<>']/g,m=>'&#'+m.charCodeAt(0)+';');
const SL=['👻 으스스함','🤝 친화력','😜 장난기','📋 계획력','💗 감수성'];
function monCanvas(code,w,h,face){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  g.fillStyle='rgba(43,36,64,0.18)'; g.fillRect(Math.round(w/2-8),h-4,17,2); G.drawSpr(g,w/2,h-4,G.SPR[code],face||1,1,0); return c; }
function jwCanvas(){ const c=document.createElement('canvas'); c.width=16; c.height=16; G.drawSpr(c.getContext('2d'),8,15,G.JWJ,1,1,0); return c; }
function ownerCanvas(code){ const c=document.createElement('canvas'); c.width=20; c.height=32; G.drawOwner(c.getContext('2d'),5,10,code); return c; }
function mateCard(item,kind){ const t=T[item.c];
  return `<div class='mate ${kind}'><div data-mon='${item.c}' data-face='${kind==='bad'?-1:1}'></div><div style='min-width:0'><span class='badge ${kind==='good'?'g':'b'}'>${kind==='good'?'🍬 사탕 원정 메이트':'💢 티격태격 주의'}</span><div class='nm'>${esc(t.name)}</div><div class='cd'>${item.c}</div></div><p>${esc(item.why)}</p></div>`; }
function ownerCard(o,kind){
  return `<div class='owner ${kind}'><div data-owner='${o.c}'></div><div style='min-width:0'><span class='badge ${kind==='good'?'g':'b'}'>${kind==='good'?'💚 찰떡 인간 친구':'💔 안 맞는 인간 친구'}</span><div class='cd'>${o.c} 인간</div><div class='nm'>${esc(o.t)}</div><p>${esc(o.why)}</p>${o.tip?`<p class='tip'><b>그래도 함께라면</b> · ${esc(o.tip)}</p>`:''}</div></div>`; }
function stars(n){ return '★'.repeat(n)+'☆'.repeat(5-n); }
function shareBase(){ return SHARE_URL || location.href.split('#')[0]; }

// 결과 카드 이미지
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function wrapText(g,text,x,y,maxW,lh,maxLines){ let line='', lines=[];
  for(const ch of String(text)){ const tst=line+ch; if(g.measureText(tst).width>maxW&&line){ lines.push(line); line=ch===' '?'':ch; } else line=tst; }
  if(line) lines.push(line); lines=lines.slice(0,maxLines||99); lines.forEach((l,i)=>g.fillText(l,x,y+i*lh)); return y+lines.length*lh; }
function makeCard(code){
  const t=T[code], W=540, H=800, c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#2b2357'); gr.addColorStop(1,'#7a62c0'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){ g.fillStyle=i%3?'rgba(255,255,255,0.5)':'#ffe58a'; g.fillRect((i*97)%W,(i*53)%H,3,3); }
  rr(g,28,28,W-56,H-56,30); g.fillStyle='#fffaf2'; g.fill(); g.lineWidth=6; g.strokeStyle='#2b2440'; g.stroke();
  g.textAlign='center'; g.fillStyle='#4f9a45'; g.font='22px Jua, sans-serif'; g.fillText('🍵 진우주가 찾아낸 너의 몬스터는…',W/2,80);
  rr(g,150,100,240,184,24); const pg=g.createLinearGradient(0,100,0,284); pg.addColorStop(0,'#cbb8f5'); pg.addColorStop(1,'#f3c9e0'); g.fillStyle=pg; g.fill(); g.lineWidth=4; g.strokeStyle='#2b2440'; g.stroke();
  g.imageSmoothingEnabled=false; G.drawSpr(g,W/2,270,G.SPR[code],1,1,0,11);
  g.fillStyle='#e0731c'; g.font=`24px 'Press Start 2P', monospace`; g.fillText(code,W/2,330);
  g.fillStyle='#2b2440'; g.font='52px Jua, sans-serif'; g.fillText(t.name,W/2,390);
  g.fillStyle='#6a6188'; g.font=`17px 'Gowun Dodum', sans-serif`; g.fillText(t.en,W/2,416);
  g.fillStyle='#7356c9'; g.font='24px Jua, sans-serif'; let y=wrapText(g,t.nick,W/2,454,430,30,2);
  rr(g,60,y-4,W-120,66,18); g.fillStyle='#ffe3ee'; g.fill(); g.lineWidth=3; g.strokeStyle='#ff8ab8'; g.stroke();
  g.fillStyle='#2b2440'; g.font=`18px 'Gowun Dodum', sans-serif`; wrapText(g,'“'+t.say+'”',W/2,y+24,W-160,24,2);
  y+=82;
  const lab=['으스스','친화력','장난기','계획력','감수성'], col=['#a98cf0','#ff8ab8','#ff9a3c','#7356c9','#ff6f9a'];
  g.textAlign='left'; g.font='18px Jua, sans-serif';
  t.st.forEach((v,i)=>{ const yy=y+i*28; g.fillStyle='#2b2440'; g.fillText(lab[i],96,yy+15);
    rr(g,176,yy,270,18,9); g.fillStyle='#efe8fb'; g.fill(); g.lineWidth=2; g.strokeStyle='#2b2440'; g.stroke();
    rr(g,176,yy,54*v,18,9); g.fillStyle=col[i]; g.fill(); g.stroke(); });
  g.textAlign='center'; g.fillStyle='#6a6188'; g.font=`16px 'Gowun Dodum', sans-serif`; g.fillText('몬BTI · 진우주의 할로윈 몬스터 감별소 🎃',W/2,H-48);
  return c;
}

function showResult(res,shared){
  mode='result'; $('intro').hidden=true; $('play').hidden=true;
  const code=res.rank[0].code, t=T[code], el=$('result'); el.hidden=false;
  const axes=shared?'':`<div class='panel'><h3><span class='k'>GRAPH</span>내 성향 그래프</h3><div class='axes'>${AX.map(([a,b,an,bn],i)=>{const p=res.pct[i];
    return `<div class='axis'><span class='a ${p>=0.5?'on':''}'>${an} ${a}</span><div><div class='bar'><i style='width:${Math.round(p*100)}%'></i></div><div class='pc'><span>${Math.round(p*100)}%</span><span>${Math.round((1-p)*100)}%</span></div></div><span class='${p<0.5?'on':''}'>${b} ${bn}</span></div>`;}).join('')}</div></div>`;
  const alts=shared?'':`<div class='panel'><h3><span class='k'>2ND · 3RD</span>내 안에 숨은 다른 몬스터</h3><p class='sub'>아슬아슬했던 성향이 반대로 기울었다면 이 친구들이었을 거예요.</p><div class='pair'>${res.rank.slice(1,3).map((o,i)=>{const a=T[o.code];
    return `<div class='mate good alt'><div data-mon='${o.code}' data-face='1'></div><div style='min-width:0'><div class='rk'>${i+2}순위 · 닮은 정도 ${Math.round(o.m*100)}%</div><div class='nm'>${esc(a.name)}</div><div class='cd'>${o.code} · ${esc(a.nick)}</div></div><p>${esc(a.desc.split('. ')[0])}.</p></div>`;}).join('')}</div></div>`;
  el.innerHTML=(shared?`<p class='hint' style='font-size:15px'>친구가 보낸 결과예요. 나는 어떤 몬스터일까요? 🎃</p>`:'')+
   `<div class='hero'><div data-hero></div><div class='meta'><span style='font-family:var(--f-disp);font-size:15px;color:var(--matcha-d)'>🍵 진우주가 찾아낸 너의 몬스터는…</span><div class='code'>${code}</div>`+
   `<h2 class='breed'>${esc(t.name)}<small>${esc(t.en)}</small></h2><div class='nick'>${esc(t.nick)}</div>`+
   `<div class='quote'>💬 말버릇 · “${esc(t.say)}”</div>`+
   `<div class='chips'><span class='chip'>${esc(t.kind)}</span><span class='chip'>👻 으스스 ${stars(t.st[0])}</span></div></div></div>`+
   `<div class='jw'><div data-jw></div><div><b>🍵 진우주의 한마디</b><p>${esc(t.jw)}</p></div></div>`+
   `<div class='panel'><h3><span class='k'>TYPE</span>어떤 몬스터인가요</h3><p>${esc(t.desc)}</p><div class='traits'>${t.traits.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`+
   `<div class='panel'><h3><span class='k'>STATS</span>몬스터 능력치</h3><div class='stats'>${t.st.map((v,i)=>`<div class='stat'><span>${SL[i]}</span><div class='sbar'><i style='width:${v*20}%'></i></div><span class='n'>${v}/5</span></div>`).join('')}</div></div>`+
   `<div class='panel'><h3><span class='k'>TONIGHT</span>나의 할로윈 밤 루틴</h3><ul class='tl'>${t.night.map(([tm,x])=>`<li><span class='tm'>${tm}</span><span>${esc(x)}</span></li>`).join('')}</ul></div>`+
   `<div class='panel'><h3><span class='k'>PROFILE</span>몬스터 프로필</h3><div class='tiles'>`+
     `<div class='tile sk'><div class='h'>⚡ 필살기</div><div class='v'>${esc(t.skill[0])}</div><p>${esc(t.skill[1])}</p></div>`+
     `<div class='tile wk'><div class='h'>💧 약점</div><p style='font-size:15px;color:var(--ink)'>${esc(t.weak)}</p></div>`+
     `<div class='tile sn'><div class='h'>🍬 최애 간식</div><div class='v'>${esc(t.snack)}</div></div>`+
     `<div class='tile it'><div class='h'>🎒 할로윈 필수템</div><div class='v'>${esc(t.item)}</div></div></div></div>`+
   axes+
   `<div class='panel'><h3><span class='k'>TRICK</span>같이 사탕 받으러 가기 좋은 친구</h3><div class='pair'>${t.walk.map(w=>mateCard(w,'good')).join('')}</div></div>`+
   `<div class='panel'><h3><span class='k'>BOO!</span>만나면 티격태격 앙숙</h3><div class='pair'>${t.growl.map(w=>mateCard(w,'bad')).join('')}</div></div>`+
   `<div class='panel'><h3><span class='k'>HUMAN</span>나와 맞는 인간, 안 맞는 인간</h3><div class='pair'>${ownerCard(t.good,'good')}${ownerCard(t.bad,'bad')}</div></div>`+
   alts+
   `<div class='panel'><h3><span class='k'>DEX</span>할로윈 몬스터 도감</h3><p class='sub'>다른 몬스터를 눌러서 구경해 봐요. 노란 칸이 ${shared?'친구':'나'}예요!</p><div class='dex'>${CODES.map(c=>`<button type='button' data-dex='${c}' class='${c===code?'me':''}'><span data-mon='${c}' data-face='1'></span>${esc(T[c].name)}<small>${c}</small></button>`).join('')}</div><div class='dexview' id='dexview'></div></div>`+
   `<div class='panel'><h3><span class='k'>CARD</span>결과 카드 저장</h3><p class='sub'>스토리에 올리기 좋은 세로 카드 이미지로 저장해요.</p><div class='share'><button class='btn mint' id='mkCard'>🖼️ 결과 카드 만들기</button></div><img class='cardimg' id='cardimg' alt='몬BTI 결과 카드' hidden><p class='toast' id='cardtoast'></p></div>`+
   `<div class='panel'><h3><span class='k'>SHARE</span>친구에게 보내기</h3><div class='share'>${shared?'':`<button class='btn' id='cpRes'>내 결과 링크 복사</button>`}<button class='btn ${shared?'':'ghost'}' id='cpTest'>검사 링크 복사</button></div>`+
   `<input class='urlbox' id='urlbox' readonly aria-label='공유 링크'><p class='toast' id='toast'></p><div class='share'><button class='btn ghost' id='again'>${shared?'나도 해 보기 🎃':'다시 해 보기'}</button></div></div>`+
   `<p class='hint'>재미로 보는 검사예요. MBTI를 빌린 놀이일 뿐 공식 성격검사가 아니에요. 해피 할로윈! 🎃🍵</p>`;
  const hc=monCanvas(code,48,36,1); hc.className='portrait'; el.querySelector('[data-hero]').replaceWith(hc);
  el.querySelector('[data-jw]').replaceWith(jwCanvas());
  el.querySelectorAll('[data-mon]').forEach(d=>d.replaceWith(monCanvas(d.dataset.mon,28,21,+d.dataset.face)));
  el.querySelectorAll('[data-owner]').forEach(d=>d.replaceWith(ownerCanvas(d.dataset.owner)));
  // 도감
  const dexBtns=el.querySelectorAll('[data-dex]');
  const showDex=c=>{ const a=T[c]; dexBtns.forEach(b=>b.classList.toggle('sel',b.dataset.dex===c&&c!==code));
    const v=$('dexview'); v.innerHTML=`<div data-dv></div><div style='min-width:0'><div class='nm'>${esc(a.name)} <small style='font-family:var(--f-pix);font-size:9px;color:var(--ink-2)'>${c}</small></div><div class='ni'>${esc(a.nick)}</div><p>${esc(a.desc.split('. ')[0])}.</p><p>💬 “${esc(a.say)}”</p></div>`;
    v.querySelector('[data-dv]').replaceWith(monCanvas(c,28,21,1)); };
  dexBtns.forEach(b=>{ b.onclick=()=>showDex(b.dataset.dex); });
  showDex(code);
  // 카드
  $('mkCard').onclick=()=>{ const go=()=>{ try{ const c=makeCard(code), url=c.toDataURL('image/png'), img=$('cardimg'); img.src=url; img.hidden=false;
      const a=document.createElement('a'); a.href=url; a.download='monbti-'+code+'.png'; document.body.appendChild(a); a.click(); a.remove();
      $('cardtoast').textContent='카드를 저장했어요! 저장이 안 되면 이미지를 길게 눌러 저장해 주세요.'; }catch(e){ $('cardtoast').textContent='카드를 만들지 못했어요. 화면을 캡처해 주세요.'; } };
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(go,go); };
  // 공유
  const resUrl=shareBase()+'#'+code, testUrl=shareBase();
  $('urlbox').value=shared?testUrl:resUrl;
  const copy=(u,msg)=>{ const ub=$('urlbox'); ub.value=u;
    const fallback=()=>{ ub.focus(); ub.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} $('toast').textContent=ok?msg:'복사가 막혔어요. 위 주소를 길게 눌러 복사해 주세요.'; };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(()=>{ $('toast').textContent=msg; },fallback); } else fallback(); };
  if($('cpRes')) $('cpRes').onclick=()=>copy(resUrl,'결과 링크를 복사했어요!');
  $('cpTest').onclick=()=>copy(testUrl,'검사 링크를 복사했어요!');
  $('again').onclick=()=>{ el.hidden=true; el.innerHTML=''; try{history.replaceState(null,'',location.pathname+location.search);}catch(e){} start(); };
  scrollTo({top:0,behavior:'smooth'});
}
function start(){ idx=0; ans=[]; mini=null; react=''; $('intro').hidden=true; $('result').hidden=true; $('play').hidden=false; box.hidden=true; showQ(); }
$('start').onclick=start;
const h=(location.hash||'').slice(1).toUpperCase();
if(Object.prototype.hasOwnProperty.call(T,h)) showResult({rank:[{code:h,m:1}]},true);
})();
</script>
