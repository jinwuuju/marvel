{id:'pla',n:'플라톤',y:'기원전 427–347',nick:'이데아의 건축가',core:'눈에 보이는 세계는 그림자이고, 이성으로만 닿는 완전한 형상(이데아)이 진짜다.',say:'동굴 밖으로 나가라. 우리가 보는 것은 그림자다.',bk:'『국가』 7권 · 동굴의 비유',pr:['요즘 나를 흔드는 ‘그림자’(SNS 비교, 남의 평가) 하나를 적고, 그 뒤의 ‘진짜’가 무엇인지 한 문장으로 써 보세요.','‘이상적인 하루’를 구체적으로 설계하고, 오늘 그중 한 조각만 실현해 보세요.'],blind:'동굴 벽의 그림자를 진짜로 믿는 사람들을 안타까워하는, 레슬링 선수였다는 소문의 학자',bio:'아카데메이아 설립 · 기하학 모르면 입장 불가',ic:'ti-building-arch',col:'#5a6fb5',v:['진리','정의'],p:[-2,-2,-2,-1,1,-2,-2,-1,0,-1],s:'RE TN CD'},
{id:'ari',n:'아리스토텔레스',y:'기원전 384–322',nick:'중용의 박물학자',core:'행복은 탁월함을 습관으로 실천하는 삶이다. 지나침과 모자람 사이의 중용을 찾는다.',say:'용기는 비겁과 무모함 사이에 있다.',bk:'『니코마코스 윤리학』',pr:['고치고 싶은 성격 하나를 골라 ‘모자람 · 중용 · 지나침’ 세 칸 표를 만들고, 중용 칸의 행동을 하루 한 번 연습하세요.','좋은 습관은 의지가 아니라 반복이 만들어요. 3주 동안 지킬 아주 작은 행동 하나를 정하세요.'],blind:'동물 해부부터 정치·시·논리까지 다 정리해야 직성이 풀리는 왕자의 가정교사',bio:'알렉산더 대왕 과외 선생 · 걸어 다니는 백과사전',ic:'ti-scale',col:'#3f8f6b',v:['행복','조화'],p:[1,-1,-1,0,1,-1,1,0,0,-1],s:'RE IC'},
{id:'dio',n:'디오게네스',y:'기원전 412–323',nick:'항아리 속 자유인',core:'남의 시선과 관습은 가짜 화폐다. 필요를 줄일수록 인간은 자유로워진다.',say:'햇빛을 가리지 말고 비켜 주시오.',bk:'디오게네스 라에르티오스, 『그리스 철학자 열전』 6권',pr:['오늘 ‘남들이 하니까’ 하는 일 하나를 찾아 하루만 하지 않아 보세요.','가진 물건 중 없어도 되는 것 세 개를 골라 보세요. 필요가 줄어든 만큼 자유가 늘어나요.'],blind:'대낮에 등불을 들고 ‘사람을 찾는다’며 시장을 돌아다니는 노숙 철학자',bio:'주소: 항아리 · 알렉산더 대왕 차단함',ic:'ti-lamp',col:'#b0773a',v:['자유','진리'],p:[2,0,0,0,-2,2,2,2,2,-1],s:'OR IC CA'},
{id:'epi',n:'에피쿠로스',y:'기원전 341–270',nick:'정원의 행복 설계자',core:'행복은 고통과 불안이 없는 평온이다. 소박한 즐거움과 우정이면 충분하다.',say:'죽음은 우리에게 아무것도 아니다.',bk:'『메노이케우스에게 보내는 편지』',pr:['지금 원하는 것을 ‘자연스럽고 필요한 것 / 자연스럽지만 불필요한 것 / 헛된 것’으로 나눠 보세요.','이번 주, 비싸지 않은 즐거움(산책, 친구와의 빵 한 조각)을 의도적으로 세 번 누리세요.'],blind:'정원에 친구들을 모아 빵과 물만으로 최고의 잔치를 여는 사람',bio:'정원 운영 중 · 쾌락주의자(라 쓰고 미니멀리스트라 읽음)',ic:'ti-plant-2',col:'#6b9b3a',v:['행복','평온'],p:[2,-1,0,2,-1,-1,2,-2,1,-1],s:'TN CA PC'},
{id:'mar',n:'마르쿠스 아우렐리우스',y:'121–180',nick:'일기 쓰는 황제',core:'통제할 수 있는 것과 없는 것을 구분하고, 내 판단과 행동에만 집중한다. 마음의 요새를 지킨다.',say:'일어나는 모든 일은 일어나야 할 대로 일어난다.',bk:'『명상록』',pr:['자기 전 3분, ‘오늘 내가 통제할 수 있었던 것과 없었던 것’을 두 칸으로 적으세요.','아침에 ‘오늘 무례한 사람을 만날 수도 있다’고 미리 떠올려 보세요. 대비한 마음은 덜 흔들려요.'],blind:'전쟁터 막사에서 밤마다 자기 자신에게 쓰는 일기를 남긴 황제',bio:'로마 황제 · 본업은 일기 · 출판 의도 없었음',ic:'ti-shield',col:'#8a5a9a',v:['평온','정의'],p:[-1,-1,-2,-2,1,-1,0,0,-2,0],s:'FF HR'},
{id:'con',n:'공자',y:'기원전 551–479',nick:'관계의 스승',core:'사람은 관계 속에서 사람다워진다. 예(禮)와 인(仁)을 닦아 나와 사회를 함께 바로 세운다.',say:'배우고 때때로 익히면 기쁘지 아니한가.',bk:'『논어』',pr:['오늘 만나는 사람의 관계(부모, 동료, 친구)에 맞는 예의 한 가지를 정해 실천해 보세요.','하루를 마치며 묻기: 남을 위한 일에 충실했나, 친구에게 믿음을 지켰나, 배운 것을 익혔나.'],blind:'제자 3천 명을 거느리고 14년 동안 자신을 써 줄 나라를 찾아 떠돈 선생님',bio:'학습 인플루언서 · 어록은 제자들이 정리함',ic:'ti-users',col:'#b5473a',v:['조화','정의'],p:[1,-1,0,-2,2,-2,1,1,-1,-1],s:'OR IC PC'},
{id:'lao',n:'노자',y:'기원전 6세기경',nick:'물처럼 사는 현자',core:'억지로 하지 않을 때 모든 것이 이루어진다. 물처럼 낮은 곳으로 흐르며 다투지 않는다.',say:'가장 좋은 것은 물과 같다.',bk:'『도덕경』',pr:['이번 주 가장 힘을 주고 있는 일 하나를 골라, 하루만 ‘덜 하기’를 실험해 보세요.','말하기 전에 한 박자 쉬세요. 아는 사람은 말이 적습니다.'],blind:'황소를 타고 국경을 넘다가, 문지기의 부탁에 5천 자만 남기고 사라진 노인',bio:'글 5천 자 남기고 잠적 · 무위(無爲) 실천 중',ic:'ti-droplet',col:'#3a8a8f',v:['평온','조화'],p:[-1,1,1,0,1,-1,1,-2,-2,-1],s:'CA FF'},
{id:'zhu',n:'장자',y:'기원전 369–286경',nick:'나비 꿈의 자유인',core:'세상의 기준은 상대적이다. 쓸모의 굴레에서 벗어나 거닐 듯 자유롭게 산다.',say:'내가 나비 꿈을 꾼 걸까, 나비가 내 꿈을 꾸는 걸까.',bk:'『장자』 내편 (소요유 · 제물론)',pr:['나를 괴롭히는 ‘좋다/나쁘다’ 판단 하나를 골라, 반대 관점에서 쓸모를 세 가지 찾아보세요.','쓸모없어 보이는 일(멍때리기, 산책)에 일부러 30분을 써 보세요. 쓸모없음의 쓸모가 있어요.'],blind:'재상 자리를 제안받자 ‘진흙탕에서 꼬리를 끌며 사는 거북이 낫다’며 거절한 사람',bio:'나비일 수도 있음 · 쓸모없음 전문가',ic:'ti-butterfly',col:'#5aa36b',v:['자유','평온'],p:[0,2,1,0,-2,1,1,-2,-1,-1],s:'CD IC CA'},
{id:'bud',n:'붓다',y:'기원전 563–483경',nick:'깨어난 사람',core:'삶의 괴로움은 집착에서 온다. 모든 것이 변한다는 것을 알면 마음이 풀려난다.',say:'모든 것은 변한다. 게으르지 말고 정진하라.',bk:'『숫타니파타』 또는 『법구경』',pr:['하루 5분, 호흡만 바라보세요. 생각이 떠오르면 ‘생각’이라고 이름 붙이고 다시 호흡으로.','괴로운 감정이 올라오면 마음속으로 ‘이것도 지나간다’고 말해 보세요.'],blind:'왕자의 자리와 궁전을 버리고 나무 아래서 깨달음을 얻은 사람',bio:'前 왕자 · 現 명상 마스터 · 집착 안 함',ic:'ti-flower',col:'#d29a2a',v:['평온','사랑'],p:[1,0,-1,-1,0,1,-1,-2,-1,2],s:'OP CA'},
{id:'won',n:'원효',y:'617–686',nick:'해골물의 자유인',core:'모든 것은 마음이 짓는다. 서로 다른 주장도 하나의 진리를 비추는 여러 면이다(화쟁).',say:'마음이 일어나면 온갖 것이 생기고, 마음이 사라지면 해골물도 그냥 물이다.',bk:'『대승기신론소』 (쉬운 원효 평전과 함께)',pr:['다툼이 생기면 ‘둘 다 맞는 부분’을 하나씩 찾아 말해 보세요. 화쟁의 첫걸음이에요.','오늘 기분을 망친 일 하나를 떠올리고, 상황이 아니라 내 마음이 붙인 해석을 적어 보세요.'],blind:'유학길 동굴에서 달게 마신 물이 해골물이었음을 알고 그 길로 돌아온 스님',bio:'유학 취소하고 귀국 · 길거리 노래(무애가) 공연 중',ic:'ti-yin-yang',col:'#7a5ab0',v:['조화','사랑'],p:[-1,1,1,0,1,1,-2,1,1,-1],s:'TN CA'},
{id:'aug',n:'아우구스티누스',y:'354–430',nick:'고백하는 영혼',core:'인간의 마음은 더 큰 사랑 안에서 쉬기 전까지 불안하다. 내면을 깊이 들여다볼 때 진리를 만난다.',say:'사랑하라, 그리고 네가 원하는 것을 하라.',bk:'『고백록』',pr:['오늘 하루를 솔직한 ‘고백 일기’로 적어 보세요. 잘한 일보다 흔들린 순간을 중심으로.','‘나는 무엇을 사랑하는가?’ 목록을 만들고 순서를 매겨 보세요. 사랑의 순서가 삶을 결정해요.'],blind:'방황하던 청춘 끝에, 정원에서 들린 아이 목소리에 삶을 바꾼 사람',bio:'前 파티피플 · 시간이란 무엇인가 연구 중',ic:'ti-heart',col:'#a8456b',v:['사랑','진리'],p:[-1,-2,1,-1,1,-1,-2,-1,-1,1],s:'TN CD'},
{id:'mac',n:'마키아벨리',y:'1469–1527',nick:'냉정한 현실주의자',core:'세상은 있어야 할 모습이 아니라 있는 모습대로 봐야 한다. 결과를 내는 사람이 판을 지킨다.',say:'사랑받는 것보다 두려움의 대상이 되는 편이 안전하다. 둘 다 가질 수 없다면.',bk:'『군주론』',pr:['목표 하나를 정하고, 이상적인 계획이 아니라 ‘사람들이 실제로 움직이는 방식’에 맞춰 계획을 다시 짜 보세요.','최근 실패를 운(포르투나)의 몫과 대비할 수 있었던 실력(비르투)의 몫으로 나눠 보세요.'],blind:'공직에서 쫓겨난 뒤, 밤마다 관복을 차려입고 고전을 읽으며 권력의 원리를 쓴 외교관',bio:'피렌체 前 외교관 · 리더십 컨설팅(냉정함 주의)',ic:'ti-chess-queen',col:'#7a2f2f',v:['힘','자유'],p:[2,0,-1,2,1,0,2,2,1,2],s:'PC CA OP'},
{id:'des',n:'데카르트',y:'1596–1650',nick:'의심의 설계자',core:'모든 것을 의심해도 의심하는 나는 남는다. 확실한 토대 위에 지식을 다시 쌓는다.',say:'나는 생각한다, 그러므로 나는 존재한다.',bk:'『방법서설』',pr:['복잡한 문제를 가장 작은 조각으로 쪼개고, 쉬운 것부터 순서대로 풀어 보세요. 데카르트의 방법 규칙이에요.','강하게 믿는 것 하나를 골라 ‘이게 틀렸다면?’을 끝까지 따라가 보세요.'],blind:'따뜻한 난로 방에 틀어박혀 생각만 하다가 좌표평면까지 발명한 늦잠꾸러기',bio:'늦잠 필수 · 좌표 발명 · 의심 많음',ic:'ti-brain',col:'#3f5a8f',v:['진리','평온'],p:[-2,-1,-2,0,-1,1,-1,-1,1,-1],s:'RE HR'},
{id:'spi',n:'스피노자',y:'1632–1677',nick:'렌즈 깎는 현자',core:'신은 곧 자연이다. 모든 일은 필연이며, 그 필연을 이해할 때 감정에서 자유로워진다.',say:'감정을 이해하는 순간, 감정은 더 이상 우리를 지배하지 못한다.',bk:'『에티카』 (해설서와 함께)',pr:['화가 나면 ‘이 감정이 생길 수밖에 없었던 원인’을 세 개 적어 보세요. 이해가 곧 해방이에요.','비웃거나 한탄하지 말고 이해하려 해 보세요. 오늘 이해 안 되는 사람 한 명을 골라서.'],blind:'공동체에서 파문당한 뒤 조용히 안경 렌즈를 깎으며 신과 자연을 증명한 사람',bio:'렌즈 장인 · 윤리학을 기하학처럼 씀',ic:'ti-eyeglass',col:'#4a7f8a',v:['진리','평온'],p:[-2,-2,-1,0,-1,1,0,-2,-2,-1],s:'FF CA RE'},
{id:'hob',n:'홉스',y:'1588–1679',nick:'질서의 설계자',core:'자연 상태의 인간은 서로를 두려워한다. 평화를 위해 우리는 강한 질서에 권리를 맡긴다.',say:'자연 상태의 삶은 고독하고, 가난하고, 험악하고, 잔인하고, 짧다.',bk:'『리바이어던』 (13~17장부터)',pr:['팀이나 가족 안의 갈등 하나를 골라, 모두가 지킬 수 있는 최소 규칙 하나를 제안해 보세요.','불안이 클 때는 ‘무엇이 나를 안전하게 하는가’부터 확보하세요. 안전이 먼저, 이상은 그다음.'],blind:'무적함대 소식에 어머니가 놀라 조산했다며 ‘나는 공포와 쌍둥이로 태어났다’고 말한 사람',bio:'공포와 쌍둥이 · 91세 장수 · 테니스 즐김',ic:'ti-building-castle',col:'#5a5a6e',v:['힘','평온'],p:[1,-1,0,1,2,-2,2,1,-1,2],s:'OR OP'},
{id:'hum',n:'흄',y:'1711–1776',nick:'유쾌한 회의주의자',core:'모든 앎은 경험에서 오고, 인과는 습관일 뿐이다. 이성은 감정의 안내를 받는다.',say:'이성은 감정의 노예이며, 또 그래야만 한다.',bk:'『인간 오성에 관한 탐구』',pr:['확신하는 인과관계 하나(‘이걸 하면 저렇게 된다’)를 골라, 실제 증거가 몇 번이었는지 세어 보세요.','생각이 꼬이면 철학을 내려놓고 친구와 식사하세요. 흄은 보드게임으로 회의주의를 달랬어요.'],blind:'모든 것을 의심하는 책을 쓰고도, 저녁엔 친구들과 보드게임을 즐긴 넉넉한 체구의 신사',bio:'인과관계 의심 중 · 백개먼 고수 · 성격 좋음',ic:'ti-question-mark',col:'#4f7a9a',v:['행복','진리'],p:[2,2,2,1,1,-1,2,0,-1,0],s:'CD RE HR'},
{id:'rou',n:'루소',y:'1712–1778',nick:'자연을 꿈꾼 몽상가',core:'인간은 본래 선하지만 사회가 타락시킨다. 진정한 자유는 함께 정한 규칙을 스스로 따르는 것이다.',say:'인간은 자유롭게 태어났지만, 어디서나 사슬에 묶여 있다.',bk:'『사회계약론』 또는 『에밀』',pr:['혼자 걷는 산책을 하며 떠오르는 감정을 그대로 적어 보세요. 『고독한 산책자의 몽상』처럼.','나를 묶는 사슬(비교, 체면, 소비) 하나를 적고, 그게 원래 내 것이었는지 물어보세요.'],blind:'자연 속 고독한 산책을 사랑하면서, 훗날 혁명가들의 경전이 될 책을 쓴 작곡가 출신 사상가',bio:'산책 중 · 오페라 작곡도 함 · 혁명의 원조(본인은 모름)',ic:'ti-trees',col:'#5c8a3a',v:['자유','정의'],p:[1,0,2,-1,1,2,0,0,2,-1],s:'HR OR FF'},
{id:'kan',n:'칸트',y:'1724–1804',nick:'산책 시계 철학자',core:'옳은 행동은 결과가 아니라 원칙에서 나온다. 사람을 결코 수단으로만 대하지 마라.',say:'네 행동의 원칙이 모두의 법칙이 되어도 좋은지 물어라.',bk:'『도덕 형이상학의 기초』 (짧고 핵심적)',pr:['고민되는 결정 앞에서 ‘모두가 이렇게 한다면?’을 물어보세요. 정언명령 테스트예요.','오늘 만나는 사람을 내 목적의 도구로만 대하고 있지 않은지 한 번 점검하세요.'],blind:'평생 고향을 거의 떠나지 않았고, 매일 같은 시각에 산책해 이웃들이 시계를 맞췄다는 교수',bio:'산책 루틴 칼같음 · 고향 밖 안 나감 · 의무 중시',ic:'ti-clock',col:'#3a4f7a',v:['정의','자유'],p:[-1,0,-2,-2,0,-1,-1,-1,1,-1],s:'PC HR'},
{id:'heg',n:'헤겔',y:'1770–1831',nick:'역사의 지휘자',core:'모든 것은 대립과 종합을 거치며 발전한다. 역사는 자유가 실현되어 가는 과정이다.',say:'미네르바의 부엉이는 황혼이 깃들어야 날개를 편다.',bk:'『역사철학 강의』 (입문서와 함께)',pr:['갈등 중인 두 입장을 적고, 둘을 모두 품는 ‘제3의 입장’을 만들어 보세요. 정·반·합.','지난 1년의 나를 ‘더 과거의 나’와 대립시키고, 그 충돌이 나를 어떻게 키웠는지 써 보세요.'],blind:'말을 타고 지나가는 나폴레옹을 보고 ‘말 위의 세계정신’을 봤다며 감탄한 교수',bio:'세계정신 관찰 중 · 문장 길이 주의',ic:'ti-git-merge',col:'#6a4a8f',v:['진리','조화'],p:[-2,-2,-1,0,2,1,-1,-1,-1,-2],s:'CD OP IC'},
{id:'mil',n:'밀',y:'1806–1873',nick:'자유의 수호자',core:'남에게 해를 끼치지 않는 한 개인은 자유로워야 한다. 옳음은 행복을 늘리는가로 판단한다.',say:'만족한 돼지보다 불만족한 인간이 낫다.',bk:'『자유론』',pr:['누군가의 선택이 못마땅할 때 ‘그게 남에게 해를 끼치는가?’만 물어보세요. 아니라면 존중.','결정 앞에서 관련된 사람들의 행복과 불행을 표로 적어 합산해 보세요.'],blind:'세 살에 그리스어를 배운 혹독한 영재교육 끝에, 스무 살에 깊은 우울을 겪고 시에서 위로를 찾은 사람',bio:'영재교육 생존자 · 여성 참정권 법안 발의 의원',ic:'ti-feather',col:'#3a7a6a',v:['자유','행복'],p:[2,1,-1,2,-1,1,1,1,1,-1],s:'PC IC'},
{id:'mrx',n:'마르크스',y:'1818–1883',nick:'세상을 바꾸려는 비판가',core:'역사는 계급 투쟁의 역사다. 철학은 세계를 해석하는 데서 멈추지 말고 바꿔야 한다.',say:'철학자들은 세계를 해석해 왔을 뿐이다. 중요한 것은 세계를 바꾸는 것이다.',bk:'『공산당 선언』 (짧다) → 입문서와 함께',pr:['내 하루의 일 중 ‘내 것이라고 느껴지지 않는 일’의 비율을 적어 보세요. 소외의 점검이에요.','불편한 사회 현상 하나를 골라 ‘누가 이익을 보는가?’를 물어보세요.'],blind:'대영박물관 열람실에 매일 출근해 자본의 비밀을 파헤친, 덥수룩한 수염의 망명객',bio:'도서관 죽돌이 · 수염 관리 안 함 · 혁명 예정',ic:'ti-hammer',col:'#b03a3a',v:['정의','자유'],p:[1,-2,0,1,2,2,2,2,-1,-1],s:'OR CA IC'},
{id:'kie',n:'키르케고르',y:'1813–1855',nick:'단독자의 고백자',core:'진리는 체계가 아니라 내가 그것을 위해 살 수 있는 것이다. 불안은 자유의 현기증이다.',say:'삶은 뒤를 돌아볼 때 이해되지만, 앞을 향해 살아야 한다.',bk:'『두려움과 떨림』 또는 『죽음에 이르는 병』',pr:['미뤄 둔 ‘이것이냐 저것이냐’ 결정 하나를 골라, 오늘 안에 선택하고 책임지는 문장을 써 보세요.','남들이 다 그렇게 산다는 이유로 고른 것 하나를 찾아, 내가 진심으로 원하는지 물어보세요.'],blind:'사랑하는 약혼녀와 파혼한 뒤, 평생 여러 가명으로 신앙과 불안에 관한 책을 쓴 산책자',bio:'필명 다수 · 파혼 후 집필 폭주',ic:'ti-stairs-up',col:'#5a4a7a',v:['의미','사랑'],p:[0,1,2,0,-2,1,-2,-1,2,1],s:'IC HR TN'},
{id:'sch',n:'쇼펜하우어',y:'1788–1860',nick:'비관의 위로자',core:'삶은 끝없는 욕망과 권태 사이를 오간다. 예술과 연민, 욕망을 내려놓음이 구원이다.',say:'삶은 고통과 권태 사이를 오가는 시계추다.',bk:'에세이 선집 『소품과 부록』 → 『의지와 표상으로서의 세계』',pr:['괴로울 때 음악 한 곡을 ‘온전히’ 들어 보세요. 쇼펜하우어는 예술이 고통을 잠시 멈춘다고 봤어요.','기대치 낮추기 연습: 오늘 일어날 수 있는 최악을 적고, 저녁에 그보다 나았던 점을 확인하세요.'],blind:'헤겔과 같은 시간에 강의를 열었다가 수강생이 거의 없었던, 푸들을 사랑한 독설가',bio:'푸들 아빠 · 헤겔 안티 · 인생 쓴맛 전문',ic:'ti-cloud-rain',col:'#5a6070',v:['평온','사랑'],p:[-1,0,1,0,-2,-1,-1,-2,-2,2],s:'OP FF'},
{id:'nie',n:'니체',y:'1844–1900',nick:'망치를 든 철학자',core:'신은 죽었다. 남이 준 가치 대신 스스로 가치를 창조하고, 운명조차 사랑하라.',say:'나를 죽이지 못하는 것은 나를 더 강하게 만든다.',bk:'『즐거운 학문』 → 『차라투스트라는 이렇게 말했다』',pr:['같은 삶이 영원히 반복된다면 오늘 하루를 기꺼이 다시 살 수 있나요? 아니라면 무엇을 바꾸겠어요?','당연하게 여겨 온 도덕 하나(‘착해야 한다’ 등)의 기원을 추적해 보세요. 누구에게 이로웠나요?'],blind:'산과 호숫가를 몇 시간씩 걸으며 사색한, 콧수염이 인상적인 문헌학 교수 출신 방랑자',bio:'콧수염 · 망치 · 산책 중독 · 신의 부고 전함',ic:'ti-bolt',col:'#8f3a5a',v:['힘','의미'],p:[1,1,2,0,-2,2,2,-1,0,2],s:'OR IC HR'},
{id:'wit',n:'비트겐슈타인',y:'1889–1951',nick:'언어의 한계를 그린 사람',core:'철학의 많은 문제는 언어의 혼란에서 생긴다. 말할 수 없는 것 앞에서는 침묵해야 한다.',say:'말로 할 수 없는 것 앞에서는 침묵하라.',bk:'『철학적 탐구』 해설서로 시작하기',pr:['다툼이 생기면 ‘우리가 같은 단어를 같은 뜻으로 쓰고 있나?’부터 확인하세요.','말로 정리되지 않는 감정은 억지로 설명하지 말고, 그림이나 산책으로 ‘보여’ 주세요.'],blind:'엄청난 유산을 형제들에게 넘기고, 노르웨이 오두막과 시골 학교에서 지낸 천재',bio:'유산 포기 · 오두막 거주 · 내 책은 내가 반박함',ic:'ti-language',col:'#3a6a8f',v:['진리','의미'],p:[1,2,-1,0,-1,1,-1,-1,0,1],s:'CD HR'},
{id:'sar',n:'사르트르',y:'1905–1980',nick:'자유를 선고받은 사람',core:'실존은 본질에 앞선다. 정해진 나는 없고, 선택으로 나를 만들며 그 책임도 진다.',say:'우리는 자유를 피할 수 없다. 선택하지 않는 것도 선택이다.',bk:'『실존주의는 휴머니즘이다』 (짧은 강연록)',pr:['‘원래 내가 그런 사람이라서’라는 말을 오늘 하루 금지해 보세요.','회피 중인 선택 하나를 적고, 선택하지 않음으로써 무엇을 선택하고 있는지 써 보세요.'],blind:'카페 테이블에서 글을 쓰고, 노벨문학상을 거절한 동그란 안경의 파리 지식인',bio:'카페 상주 · 노벨상 거절 · 자유 과다',ic:'ti-coffee',col:'#4a4a4a',v:['자유','의미'],p:[1,-1,0,1,-1,2,2,2,2,1],s:'FF CA TN'},

<script id='engine'>
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),R0=Math.round;
const med=a=>{if(!a.length)return 1;const b=a.slice().sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
function pear(a,b){const ma=avg(a),mb=avg(b);let n=0,da=0,db=0;a.forEach((v,i)=>{n+=(v-ma)*(b[i]-mb);da+=(v-ma)**2;db+=(b[i]-mb)**2});return da&&db?n/Math.sqrt(da*db):0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gauss=r=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())};
const hs=s=>{s=String(s);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const XO=[-1,-.5,.5,1],WT={L:1,D:1.3,M:1};
function contrib(x,v,acq){return x.ty=='L'?(cl(v-acq,1,5)-3)/2*x.k:(x.pl=='B'?1:-1)*XO[v-1]}
function axU(A,acq,r){const U=[],SE=[],LM=[],NM=[];AK.forEach(a=>{let its=AXITEMS[a].filter(x=>A[x.id]!=null);if(r)its=its.map(()=>its[Math.floor(r()*its.length)]);let sw=0,s=0;const cs=[];its.forEach(x=>{const c=contrib(x,A[x.id],acq),w=WT[x.ty];sw+=w;s+=w*c;cs.push(c)});const m=sw?s/sw:0;U.push(m);SE.push(Math.max(Math.sqrt(avg(cs.map(c=>(c-m)**2))),.25)/Math.sqrt(Math.max(1,cs.length)));if(!r){LM.push(avg(its.filter(x=>x.ty=='L').map(x=>contrib(x,A[x.id],acq))));NM.push(avg(its.filter(x=>x.ty!='L').map(x=>contrib(x,A[x.id],acq))))}});return {U,SE,LM,NM}}

const rankPh=(U,b)=>PH.map(ph=>{const base=fitPh(ph,U);return {ph,base,F:base+b[ph.id]}}).sort((x,y)=>y.F-x.F);
function analyze(rp,boot){const A=rp.ans,Ls=ITEMS.filter(x=>x.ty=='L'&&A[x.id]!=null),acq=avg(Ls.map(x=>A[x.id]-3)),{U,SE,LM,NM}=axU(A,acq),b=bonus(A,rp.elim,rp.sym),fits=rankPh(U,b),top=fits[0];
let cert=null,alt=null;if(boot){const r=rng(hs((rp.name||'')+'|'+Object.values(A).join(''))),cnt={};for(let k=0;k<200;k++){const id=rankPh(axU(A,acq,r).U,b)[0].ph.id;cnt[id]=(cnt[id]||0)+1}cert=(cnt[top.ph.id]||0)/200;const o=Object.keys(cnt).filter(i=>i!=top.ph.id).sort((x,y)=>cnt[y]-cnt[x])[0];if(o)alt={id:o,f:cnt[o]/200}}

if(inc.length>=4){rel-=20;notes.push(`같은 축을 다른 방식으로 물었을 때 ${inc.length}개 축에서 답이 반대로 나왔어요.`)}else if(inc.length==3)rel-=10;
if(Math.abs(acq)>.75){rel-=8;notes.push(`방향과 상관없이 ‘${acq>0?'그렇다':'아니다'}’를 고르는 경향이 있어 점수에서 보정했어요.`)}

function persona(r,i){const b=Math.floor(r()*PH.length),t=AK.map((k,j)=>cl(PH[b].p[j]/2*.8+gauss(r)*.4,-1,1)),u=r(),vr=VK.map(v=>[v,gauss(r)+(PH[b].v.includes(v)?1.3:0)]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);return {i,b,t,vr,acq:gauss(r)*.3,sp:.7+r()*.6,type:u<.1?'careless':u<.2?'mid':'normal'}}
function respond(p,key,ans,lat){ITEMS.forEach(x=>{const r=rng(hs(key+'|'+x.id)),t=p.t[x.ai];let v;if(x.ty=='L'){v=cl(R0(3+1.9*x.k*t+p.acq+gauss(r)*.75),1,5);if(p.type=='mid'&&r()<.35)v=3}else{const z=(x.pl=='B'?1:-1)*t*1.3+gauss(r)*.45;v=z<-.45?1:z<0?2:z<.45?3:4}
if(p.type=='careless'&&r()<.6)v=1+Math.floor(r()*(x.ty=='L'?5:4));ans[x.id]=v;lat[x.id]=(900+x.len*55)*p.sp*(.75+.9*Math.exp(-1.5*Math.abs(t)))*Math.exp(gauss(r)*.3)*(p.type=='careless'?.2:1)})}
function simRun(p,key){const ans={},lat={};respond(p,key,ans,lat);const rr=rng(hs(key+'v')),elim=p.vr.map((v,j)=>[v,9-j+gauss(rr)*1.2]).sort((x,y)=>x[1]-y[1]).map(x=>x[0]),rp={name:'sim'+key,ans,lat,elim,sym:[]};
const rs=rng(hs(key+'s'));rp.sym=analyze(rp).fits.slice(0,4).map(o=>[o.ph.id,fitPh(o.ph,p.t)+gauss(rs)*3]).sort((x,y)=>y[1]-x[1]).slice(0,2).map(x=>x[0]);return {rp,R:analyze(rp)}}
function runSim(seed){const r=rng(seed),P=[];for(let i=0;i<100;i++)P.push(persona(r,i));return {seed,P,O:P.map((p,i)=>[0,1,2].map(k=>simRun(p,seed+'-'+i+'-'+k)))}}
function metrics(P,O){const prs=[[0,1],[0,2],[1,2]];const rec=avg(AK.map((k,j)=>avg([0,1,2].map(t=>pear(P.map(p=>p.t[j]),O.map(o=>o[t].R.U[j])))))),rt=avg(AK.map((k,j)=>avg(prs.map(([a,b])=>pear(O.map(o=>o[a].R.U[j]),O.map(o=>o[b].R.U[j]))))));
let acc=0,acc1=0,aN=0,st=0,sn=0,sN=0,fa=0,fN=0;P.forEach((p,i)=>{const tr=PH.map(ph=>[ph.id,fitPh(ph,p.t)]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);O[i].forEach(e=>{const t1=e.R.top.ph.id;if(p.type!='careless'){aN++;if(tr.slice(0,3).includes(t1))acc++;if(tr[0]==t1)acc1++}if(p.type=='careless'){sN++;if(e.R.rel<60)sn++}else if(p.type=='normal'){fN++;if(e.R.rel<60)fa++}});
prs.forEach(([a,b])=>{if(O[i][b].R.fits.slice(0,3).some(o=>o.ph.id==O[i][a].R.top.ph.id))st++})});return {rec,rt,acc:acc/(aN||1),acc1:acc1/(aN||1),st:st/300,sens:sN?sn/sN:0,fa:fN?fa/fN:0}}

const fmt=(v,t)=>t=='r'?v.toFixed(2):(v*100).toFixed(1)+'%';
function runSimSync(seed){const t0=performance.now();SIM=runSim(seed);SIM.m=metrics(SIM.P,SIM.O);SIM.ms=performance.now()-t0}
function simScreen(seed){S.mode='sim';app.innerHTML=`<div class='w' style='text-align:center'>${owl('wow',110)}<p class='sm'>가상 인물 100명이 각각 3번씩 정원을 거니는 중이에요…</p></div>`;setTimeout(()=>{runSimSync(seed);simReport()},50)}
function simReport(){S.mode='sim';const m=SIM.m,P=SIM.P,cnt=t=>P.filter(p=>p.type==t).length;let pass=0,tot=0;const weak=[];
const rows=SROWS.map(([l,k,t,tg,dir])=>{const v=m[k];let st='–';if(tg!=null){tot++;const ok=dir>0?v>=tg:v<=tg;if(ok)pass++;else weak.push(l);st=ok?`<span style='color:var(--good)'>충족</span>`:`<span style='color:var(--warn)'>미달</span>`}return `<div style='display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 44px;gap:6px;padding:8px 0;border-bottom:.5px solid var(--line);font-size:13.5px;align-items:center'><span>${l}</span><span style='text-align:right;font-weight:700'>${fmt(v,t)}</span><span style='text-align:right;color:var(--ink3)'>${tg==null?'–':(dir<0?'≤':'≥')+fmt(tg,t)}</span><span style='text-align:right'>${st}</span></div>`}).join('');
const mc=(l,v)=>`<div class='met'><p class='sm' style='margin:0'>${l}</p><p class='disp' style='font-size:22px;margin:0'>${v}</p></div>`;
app.innerHTML=`<div class='w rise'><span class='chip'>검증 시뮬레이션 · 시드 ${SIM.seed}</span><span class='chip'>${R0(SIM.ms)}ms · 300회 응답</span><p class='disp' style='font-size:24px;margin:.4rem 0'>가상 인물 100명 × 3회 반복 검사</p><p class='mut' style='margin:0 0 1rem'>실제 사유 성향을 미리 정해 둔 가상 인물들이 검사를 받으면, 채점 엔진이 그 성향을 얼마나 되찾는지 확인해요. 같은 인물이 세 번 응답해 결과가 얼마나 흔들리는지도 봅니다.</p><p class='sm'>구성: 성실 응답 ${cnt('normal')}명 · 중간값 선호 ${cnt('mid')}명 · 불성실 응답 ${cnt('careless')}명</p><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:1rem 0'>${mc('목표 충족',`${pass} / ${tot}`)}${mc('1위가 실제 상위 3인',fmt(m.acc,'%'))}${mc('축 측정 정확도',fmt(m.rec,'r'))}${mc('불성실 탐지',fmt(m.sens,'%'))}</div><div class='card'><div style='display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 44px;gap:6px;padding:0 0 6px;border-bottom:.5px solid var(--line2);font-size:12px;color:var(--ink2)'><span>지표</span><span style='text-align:right'>결과</span><span style='text-align:right'>목표</span><span style='text-align:right'>판정</span></div>${rows}<p class='sm' style='margin:10px 0 0'>${weak.length?`이번 시드에서 기준 미달: ${weak.join(', ')}. 100명 표본은 시드마다 몇 %p씩 흔들려요.`:'이번 시드에서 모든 목표 지표를 충족했어요.'} 철학자 30인 중 실제 1위를 정확히 맞히기는 어려운 과제라, 상위 3인 적중을 핵심 목표로 삼았어요.</p></div><p class='sm'>이 시뮬레이션은 채점 논리의 안정성을 검증해요. 문항이 실제 사람의 생각을 잘 재는지는 실제 응답 데이터로만 확인할 수 있어요.</p><p class='b' style='margin:1.5rem 0 .5rem'>가상 인물의 결과지 열어 보기</p><select id='pp' style='width:100%;margin-bottom:8px'>${P.map((p,i)=>`<option value='${i}'>#${i+1} · 출발점 ${PH[p.b].n} · ${TYPEL[p.type]}</option>`).join('')}</select><div style='display:flex;gap:8px;flex-wrap:wrap'><button id='po'><i class='ti ti-file-text'></i> 결과지 보기</button><button id='rs'><i class='ti ti-refresh'></i> 새 시드로 다시 실행</button><button id='bk2'><i class='ti ti-arrow-left'></i> 처음으로</button><button id='sendS'>수치를 Claude에게 보내기 ↗</button></div></div>`;
window.scrollTo(0,0);$('#po').onclick=()=>loadPersona(+$('#pp').value);$('#rs').onclick=()=>simScreen(Math.floor(Math.random()*1e6));$('#bk2').onclick=intro;$('#sendS').onclick=()=>sendPrompt(`[진우주 철학 검사 · 브라우저 검증 시뮬레이션 · 시드 ${SIM.seed}] `+SROWS.map(([l,k,t])=>`${l}: ${fmt(m[k],t)}`).join(' / ')+` / 미달: ${weak.join(', ')||'없음'}. 이 결과를 해석하고 채점 로직을 개선할 방법을 제안해줘.`)}
function loadPersona(i){const rp=SIM.O[i][0].rp;fresh();Object.assign(S,{name:`가상 인물 #${i+1}`,ans:rp.ans,lat:rp.lat,elim:rp.elim,sym:rp.sym,preview:i});renderResult(analyze(rp,true))}
setTheme(LS.get('ph_theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dusk':'day'));
$('#themeB').onclick=()=>setTheme(document.documentElement.dataset.theme=='dusk'?'day':'dusk');
