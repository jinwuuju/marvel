['스파이더맨: 홈커밍 (2017)','슈트를 빼앗긴 채 무너진 창고 잔해에 깔렸다. 숨이 막혀 온다. 물웅덩이에 비친 얼굴이 묻는다. 슈트가 없으면 넌 아무것도 아닌가?','',[['이를 악물고 혼자 힘으로 잔해를 들어올린다','sm3 ca1'],['소리쳐 도움을 청하며 체력을 아낀다','am2 sl1'],['구조를 계산해 지렛대 원리로 빠져나간다','im1 rk2'],['분노가 차오른다. 그 힘으로 전부 부숴버린다','hk2 km1']]],
['닥터 스트레인지 (2016)','사고로 두 손을 잃은 천재 외과의. 전 재산을 쓴 끝에 찾아간 수상한 사원에서 스승이 말한다. 지금까지 믿어온 것을 내려놓으라고.','',[['과학으로 설명 안 되는 건 사기다. 돌아선다','im1 ul1 rk1'],['자존심을 내려놓고 문 앞에서 밤새 버틴다','ds2 hk1'],['금지된 서고의 책까지 몰래 전부 읽어 치운다','ds2 lk1'],['손만 고칠 수 있다면 어떤 대가라도 치른다','tn1 km1 sw1']]],
['캡틴 마블 (2019)','기억을 잃은 채 지구에 추락했다. 당신을 키운 조직은 말한다. 네 힘은 우리가 준 선물이니, 우리 방식대로만 써라.','',[['억제 장치를 뜯어내고 내 힘을 끝까지 끌어올린다','cm3 hl1'],['조용히 기록을 뒤져 진실부터 확인한다','bw2 ds1'],['의심은 접어두고 일단 조직에 충성한다','he1 bp1 ca1'],['그 힘이면 조직 따위 내가 지배한다','hl2 tn1']]],
['가디언즈 오브 갤럭시 (2014)','우주 감옥 탈옥 작전 중, 경보가 울리는 와중에 압수당한 낡은 카세트 플레이어가 눈에 들어왔다. 엄마가 남긴 유일한 물건이다.','',[['목숨 걸고 다시 가지러 간다. 이건 포기 못 해','sl3 dp1'],['미련 없다. 작전이 우선이다','bw1 he1 tn1'],['나무 동료한테 슬쩍 가져와 달라고 시킨다','rk2 lk1'],['팀원들에게 작전을 바꾸자고 제안한다','ca1 bp1 am1']]],
['앤트맨 (2015)','막 출소했는데 양육비를 못 내 딸 면회도 막혔다. 그때 수상한 노박사가 제안한다. 내 슈트를 훔쳐 갈 사람을 찾고 있었다고.','',[['딸에게 영웅이 될 수 있다면 수락','am3 he1'],['함정 냄새가 난다. 거절','ca1 bw1'],['조건부터 따져서 내 몫을 최대로 협상','rk2 lk1'],['훔친 김에 그 슈트 내가 계속 쓴다','dp2 sl1']]],
['블랙 팬서 (2018)','왕위에 오른 지 얼마 안 됐는데, 존재조차 몰랐던 사촌이 나타나 결투를 신청한다. 그의 사연 속엔 선왕이 저지른 잘못이 숨어 있었다.','',[['왕의 책임으로 결투를 받아들인다','bp2 th1'],['먼저 선왕의 잘못을 인정하고 사과한다','bp1 sm1 hk1'],['결투 전에 그의 과거부터 철저히 조사한다','bw2 ds1'],['솔직히 그의 분노가 이해된다. 그의 편에 선다','km3']]],
['데드풀 (2016)','말기 진단을 받은 날 밤, 수상한 남자가 명함을 건넨다. 실험이 성공하면 병도 낫고 초능력까지 생긴다고. 실패 확률은 묻지 말란다.','',[['연인에게 말없이 사라져 실험을 받는다','dp2 hk1'],['남은 시간을 사랑하는 사람과 보낸다','sl2 he1'],['그 실험의 논문과 데이터부터 전부 찾는다','im1 ds1 ul1'],['영원히 살 수 있다면, 할 일이 많지','tn1 hl1 ul1']]],
['어벤져스 (2012)','공중 항공모함 회의실. 누군가는 몰래 무기 계획을 숨겼고, 누군가는 분노로 눈빛이 초록색으로 변하는 중이다. 공기가 터지기 직전이다.','',[['숨겨진 서버를 해킹해 전부 까발린다','im2 rk1'],['모두 진정시키고 지금 할 일부터 정리한다','ca2 bp1'],['폭주 직전인 동료 옆에 조용히 다가가 말을 건다','bw2 sw1'],['이 혼란, 내가 기다리던 거다','lk3']]],
['어벤져스 (2012)','외계 군단이 쏟아지는 뉴욕 한복판. 처음 모인 영웅들이 서로를 쳐다본다. 누가 지휘할 건데?','',[['내가 한다. 각자 위치로','ca2 im1 hl1'],['지휘? 난 그냥 부수러 간다','hk2 th1 dp1'],['제일 적합한 사람을 추천하고 따른다','bp1 he2'],['리더는 필요 없다. 각자 알아서 날아간다','sl1 cm2']]],
['어벤져스: 에이지 오브 울트론 (2015)','외계의 다음 침공을 막을 지구 방어 AI를 만들 수 있다. 다만 팀에 알리면 분명 반대할 것이다.','',[['만든다. 허락보다 용서가 쉽다','im3 ul1'],['팀과 공개적으로 토론한다','ca2 bp1'],['그 AI는 결국 인류가 문제라고 결론 내리겠지. 나도 동의한다','ul3'],['기계 말고 사람을 더 훈련시킨다','he2 bw1']]],
['어벤져스: 에이지 오브 울트론 (2015)','도시 하나가 통째로 하늘로 떠올랐다. 떨어지면 지구가 끝난다. 마지막 시민들이 아직 대피 중이다.','',[['마지막 한 명이 탈 때까지 떠나지 않는다','ca2 he1 sm1'],['도시를 공중에서 폭파해 확실히 막는다','im1 tn1 cm1'],['핵심 장치 앞을 혼자 끝까지 지킨다','sw2 bw1'],['인류는 여기까지다. 떨어지게 둔다','ul2 hl1']]],
['가디언즈 오브 갤럭시 (2014)','폐허 행성에서 주운 은빛 구슬. 열어보니 행성 하나를 지울 힘이 잠들어 있다. 암시장에선 평생 놀고먹을 값을 부른다.','',[['판다. 돈은 거짓말을 안 한다','rk2 sl1'],['위험하다. 가장 안전한 곳에 맡긴다','bp1 ds1 ca1'],['일단 쥐고 있다가 협상 카드로 쓴다','lk2 bw1'],['그 힘, 내가 직접 쓴다','tn2 hl1']]],
['가디언즈 오브 갤럭시 (2014)','말하는 너구리, 걷는 나무, 복수에 미친 전사, 암살자 출신. 감옥에서 만난 오합지졸이 함께 은하를 구하자고 한다.','',[['좋아, 우리 이제 한 팀이다','sl2 am1 th1'],['말 말고 행동으로 증명해 봐','bw1 rk2'],['미안, 난 혼자가 편하다','hk1 cm1 dp1'],['이 녀석들, 내 목적에 쓸 만하겠는데','lk1 km1 tn1']]],
['토르: 라그나로크 (2017)','낯선 행성의 검투장에 끌려왔다. 관중의 함성 속에 문이 열리고, 상대로 나온 건 오랫동안 연락 끊긴 동료다.','',[['반갑다! 일단 신나게 한판 붙는다','th2 hk1'],['싸우는 척하며 탈출로를 찾는다','bw1 lk1 am1'],['관중을 위해 최고의 쇼를 보여준다','dp2 sl1'],['무기를 내려놓고 동료를 말로 설득한다','bw1 sm1 bp1']]],
['블랙 팬서 (2018)','수천 년간 숨겨온 나라의 첨단 기술. 세계 정상회의 단상에 섰다. 이걸 세상에 공개할 것인가.','',[['공개하고 세상을 돕는다','bp2 sm1'],['아직 때가 아니다. 숨긴다','he1 bw1 ds1'],['억압받는 사람들에게 무기로 나눠준다','km3'],['그 기술로 세계 질서를 새로 쓴다','hl1 ul1 tn1']]],
['캡틴 아메리카: 시빌 워 (2016)','희생자 유족의 항의 끝에 정부가 협정을 내밀었다. 앞으로 히어로는 위원회 허가 없이 출동할 수 없다. 동료들은 정확히 반으로 갈렸다.','',[['서명한다. 힘에는 감시가 필요하다','im2 bw1'],['거부한다. 옳은 일은 허락받는 게 아니다','ca3'],['조항을 고치자고 협상 테이블을 만든다','bp2 ds1'],['어느 편도 들지 않고 은퇴한다','he1 cm1 sl1']]],
['캡틴 아메리카: 시빌 워 (2016)','공항 활주로. 양쪽 진영이 마주 보고 달려간다. 맞은편에 가장 친한 친구가 서 있다.','',[['봐주지 않는다. 이건 신념의 싸움이다','ca1 im1 km1'],['친구는 피하고 다른 상대를 맡는다','he2 bw1'],['우와 저 사람 진짜 영웅이잖아. 사인부터','sm2 am2'],['둘 다 바보다. 나는 빠진다','dp1 rk1 cm1']]],
['캡틴 아메리카: 시빌 워 (2016)','시베리아 기지에서 오래된 영상이 재생된다. 부모님을 죽인 범인이, 지금 옆에 서 있는 친구다.','',[['이성을 잃고 달려든다','im2 hk1'],['세뇌당했던 친구를 몸으로 막아선다','ca2 he1'],['이걸 보여준 진짜 배후부터 쫓는다','bp2 bw1'],['영상 하나로 최강의 팀을 무너뜨리다니, 완벽한 계획이다','lk2 ul1']]],
['토르: 라그나로크 (2017)','처음 보는 누나가 나타나 왕좌를 내놓으라 한다. 내 무기는 그녀의 한 손에 산산조각 났다.','',[['무기 따위 없어도 내가 곧 힘이다','th3 cm1'],['일단 후퇴해서 동료를 모은다','ca1 sl1 rk1'],['누나와 거래를 시도한다','lk2 bw1'],['왕좌는 강한 자의 것. 그녀 편에 선다','hl3']]],
['토르: 라그나로크 (2017)','불의 거인을 깨우면 고향 행성과 함께 적도 사라진다. 백성들은 우주선에 탔지만, 내가 자란 모든 곳이 불탄다.','',[['고향은 장소가 아니라 사람이다. 깨운다','th2 bp1'],['끝까지 싸워서 땅까지 지킨다','ca1 hk1'],['마지막 피난선이 떠나는 걸 확인하고 결정한다','he2 sm1'],['적과 함께 전부 불태운다. 깔끔하게','hl1 tn1 sw1']]],
['캡틴 아메리카: 윈터 솔저 (2014)','소속 정보기관 깊숙이 적이 숨어 있었다. 엘리베이터 문이 닫히고, 정장 입은 요원들이 조용히 당신을 둘러싼다.','',[['믿을 수 있는 동료 단 한 명과 움직인다','ca2 bw1'],['기관의 비밀 데이터를 전부 세상에 풀어버린다','bw2 sm1'],['아무도 믿지 않는다. 혼자 해결한다','cm1 he1 rk1'],['숨어 있던 적과 조용히 거래를 튼다','lk2 ul1']]],
['어벤져스: 엔드게임 (2019)','눈앞에서 가족이 먼지가 되어 사라졌다. 그 뒤로 세계 곳곳의 범죄 조직이 하나둘 쓰러진다. 정체불명의 복수자 때문이라는 소문이 돈다.','그게 당신이라면?',[['분노가 식을 때까지 멈추지 않는다','he1 km2'],['오랜 친구가 찾아오면 그 손을 잡는다','he2 bw1'],['분노를 연구에 쏟아붓는다','im1 rk1'],['맥주와 게임 속으로 숨는다','th2 sl1']]],
['완다비전 (2021)','상실의 슬픔을 견디지 못해, 작은 마을 하나를 통째로 행복한 시트콤 세계로 바꿔버렸다. 그 안에선 잃은 사람이 다시 웃는다.','',[['모두가 행복하잖아. 이대로 유지한다','sw3'],['마을 사람들을 풀어주고 혼자 이별을 견딘다','sw1 bp1 sm1'],['밖에서 진실을 쫓아온 사람과 마주 앉아 대화한다','cm1 ds1 bw1'],['이 힘이면 현실 전체를 다시 쓸 수 있다','hl1 tn1 sw1']]],
['스파이더맨: 노 웨이 홈 (2021)','정체가 전 세계에 공개됐다. 친구들이 대학에 떨어진 것도 나 때문이다. 마법사가 말한다. 모두의 기억을 지워주겠다고. 대신 아무도 당신을 기억하지 못한다.','',[['괜찮아. 모두가 날 잊어도 지킬 수 있다면','sm3'],['정체 그대로 당당하게 살아간다','im2 dp1'],['변호사부터 찾아 정면 돌파한다','am2 bw1'],['주문 도중에 조건을 계속 수정해 달라고 한다','sm1 sl1 dp1']]],

['어벤져스: 엔드게임 (2019)','손가락 소리 이후 5년. 세상은 반쯤 비어 있고, 사람들은 조금씩 익숙해지는 중이다.','당신은 어떻게 지내고 있나?',[['호숫가 오두막에서 가족과 조용히 산다','im1 he1 tn1'],['남은 사람들의 상실 극복 모임을 이끈다','ca2 bw1'],['쉬지 않고 우주 곳곳을 순찰한다','cm2 rk1'],['배가 나오도록 맥주와 게임으로 버틴다','th2 sl1']]],
