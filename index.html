<script>
const NL=String.fromCharCode(10);
const HK=['H','E','X','A','C','O'],RK=['R','I','A','S','E','C'],AK=['KR','WI','LO','FR','GL','JU','GU','JO'];
const HX={H:'정직·겸손',E:'정서성',X:'외향성',A:'원만성',C:'성실성',O:'개방성'},RI={R:'전장',I:'실험실',A:'무대',S:'아지트',E:'왕좌',C:'통제실'},RIL={R:'몸으로 부딪혀 해치우기',I:'분석과 설계',A:'연출과 스타일',S:'내 사람 챙기기',E:'지배와 승부',C:'규칙과 통제'},AN={KR:'지배',WI:'진실',LO:'사랑',FR:'자유',GL:'인정',JU:'정의',GU:'수호',JO:'쾌락'};
const B1={H:[[0,'이길 수 있어도 반칙으로 얻은 승리는 찜찜해서 싫다.'],[1,'원하는 걸 얻으려면 상대가 듣고 싶어 하는 말을 골라서 하는 편이다.'],[1,'나는 보통 사람들보다 특별한 대우를 받을 자격이 있다고 느낀다.'],[0,'아무도 모를 일이라도 남의 몫에는 손대지 않는다.']],

A:[[0,'나에게 상처 준 사람이 진심으로 사과하면 비교적 빨리 마음이 풀린다.'],[1,'나를 무시한 사람에게는 언젠가 되갚아 줘야 직성이 풀린다.'],[0,'내가 옳다고 확신해도 관계를 위해 한발 물러설 때가 많다.'],[1,'한 번 나를 배신한 사람은 다시는 믿지 않는다.']],

O:[[0,'남들이 엉뚱하다고 하는 아이디어에 오히려 끌린다.'],[1,'검증된 방식이 있다면 굳이 새로운 방법을 시도할 이유가 없다.'],[0,'‘왜 꼭 그래야 하지?’라는 질문을 자주 던진다.'],[1,'정답이 정해지지 않은 추상적인 토론은 시간 낭비 같다.']]};
const B2={R:['직접 몸으로 부딪혀서 막힌 상황을 뚫어 낸다.','고장 난 기계나 장비를 분해해 내 손으로 고친다.'],I:['아무도 못 푼 사건의 원인을 끝까지 파고든다.','상대의 다음 수를 데이터와 논리로 미리 계산해 둔다.'],A:['모두의 시선이 쏠리는 장면을 처음부터 끝까지 연출한다.','남들과 전혀 다른 나만의 스타일을 만들어 낸다.'],S:['지친 동료를 챙기고 회복할 때까지 곁을 지킨다.','갈 곳 없는 사람들을 모아 하나의 식구로 만든다.'],E:['사람들을 설득해 내 편으로 만들고 앞장서 이끈다.','큰 판에서 협상해 더 유리한 조건을 따낸다.'],C:['흩어진 정보를 체계적으로 정리해 한눈에 보이게 만든다.','규칙과 절차를 만들어 모두가 그대로 따르게 한다.']};

{k:'voldemort',n:'볼드모트',w:'해리 포터',t:'죽음을 두려워한 고아',f:'wnd',code:'IEC',d:'H-1,A-1,X-.5',an:'KR,GL,WI',col:'#3a5a3a',plea:'평범하게 죽는 것만은 견딜 수 없었다.',desc:'뛰어난 지성과 야망으로 누구보다 높이 오르려는 사람. 하지만 사랑받아 본 적 없는 결핍과 죽음에 대한 공포가 그를 끝없이 무언가를 움켜쥐게 만듭니다.',story:'고아원에서 자란 소년은 어릴 때부터 남다른 재능을 보였습니다. 그는 자신의 평범한 출생을 지우고 영원한 존재가 되기 위해 영혼을 쪼개는 금지된 마법까지 손댔지만, 끝내 사랑의 힘만은 이해하지 못했죠.',pw:['정점을 향한 야망','남들이 상상하지 못한 높이를 목표로 삼습니다'],fl:['영혼의 분열','이기기 위해 나를 조각내면 결국 아무것도 남지 않습니다'],now:'연구소장, 공격적인 투자자, 대형 조직의 설계자'},

{k:'ursula',n:'우르술라',w:'인어공주',t:'계약서를 쓰는 바다 마녀',f:'amb',code:'AEC',d:'X1,H-1,O.5',an:'KR,JO,GL',col:'#7a3fa0',plea:'계약서에 다 쓰여 있었잖아.',desc:'사람의 욕망을 정확히 읽고 그것을 거래로 바꾸는 협상의 달인. 쇼맨십과 카리스마가 넘치지만, 상대의 절박함을 이용하는 순간 신뢰를 잃습니다.',story:'바다 왕국에서 추방된 마녀는 깊은 동굴에서 절박한 이들과 거래를 했습니다. 사람이 되고 싶은 인어 공주에게 다리를 주는 대신 목소리를 받아 갔죠. 모든 조건은 계약서에 쓰여 있었지만, 함정도 함께 쓰여 있었습니다.',pw:['욕망을 읽는 눈','상대가 진짜 원하는 것을 단번에 알아챕니다'],fl:['독이 든 계약','상대의 절박함을 이용한 거래는 결국 나를 겨눕니다'],now:'협상가, 엔터테인먼트 사업가, 영업 총괄'},
{k:'yeonjin',n:'박연진',w:'더 글로리',t:'모든 걸 가진 자의 오만',f:'amb',code:'EAS',d:'H-1,A-1,X1',an:'GL,KR,JO',col:'#d65a7a',plea:'원래 세상은 가진 사람 편이야.',desc:'자신감과 사교성이 넘치고 원하는 것을 얻는 법을 아는 사람. 그러나 공감 없는 자신감은 남에게 지울 수 없는 상처를 남기고, 그 상처는 언젠가 반드시 돌아옵니다. 이 결과는 미화가 아니라 경고의 거울이에요.',story:'학창 시절 그녀는 친구들과 함께 한 학생에게 잔혹한 괴롭힘을 가했습니다. 세월이 흘러 화려한 삶을 살던 그녀 앞에, 그 모든 것을 기억하는 피해자가 오랜 시간 준비한 복수와 함께 나타났습니다.',pw:['당당한 존재감','어디서든 주목받고 사람을 모읍니다'],fl:['공감의 부재','타인의 고통을 보지 못하면 결국 모든 것이 무너집니다'],now:'방송인, 마케터, 이 존재감을 공감과 함께 쓰는 리더'},
{k:'taeoh',n:'조태오',w:'베테랑',t:'책임지지 않는 상속자',f:'amb',code:'EAR',d:'H-1,A-1,C-1',an:'JO,KR,GL',col:'#5a5a6a',plea:'가진 사람은 책임 같은 거 안 져도 되잖아.',desc:'대담하고 거침없으며 판을 크게 벌이는 사람. 하지만 특권을 당연하게 여기고 결과에 책임지지 않는 태도는 결국 모든 것을 잃게 만듭니다. 이 결과는 미화가 아니라 경고의 거울이에요.',story:'재벌 3세인 그는 돈으로 해결되지 않는 일은 없다고 믿었습니다. 그의 갑질과 범죄는 늘 돈으로 덮였지만, 끈질긴 형사 한 명이 그를 끝까지 쫓으면서 모든 것이 드러나기 시작했습니다.',pw:['거침없는 배짱','큰 판 앞에서도 주저하지 않습니다'],fl:['특권의 착각','책임 없는 자유는 결국 몰락으로 돌아옵니다'],now:'이 배짱을 책임과 함께 쓰는 경영자, 승부사 기질의 투자자'},

let CREW_RET=null;
function crewLoad(){try{const a=JSON.parse(LS.get('vl_crew')||'null');return Array.isArray(a)?a:null}catch(e){return null}}
function crewSave(a){LS.set('vl_crew',JSON.stringify(a))}
const inviteMsg=(n,c)=>['[진우주 빌런 검사 · 빌런 연합 초대]',`${n}이(가) 당신을 빌런 연합에 초대했어요.`,'검사를 마친 뒤 결과 화면의 “연합 결성”에 아래 코드를 붙여넣으면 우리 궁합이 나와요.','',c].join(NL);
function crewAdd(codes,list){const r={add:0,upd:0,dup:0,full:0};list.forEach(c=>{const o=decCode(c);if(!o)return;if(codes.includes(c)){r.dup++;return}const k=codes.findIndex(x=>{const q=decCode(x);return q&&q.n===o.n});if(k>=0){const q=decCode(codes[k]);if((o.d||'')>=(q.d||'')){codes[k]=c;r.upd++}else r.dup++;return}if(codes.length>=8){r.full++;return}codes.push(c);r.add++});return r}

<div class='card'><div style='display:flex;justify-content:space-between;align-items:baseline'><p class='disp' style='font-size:19px;margin:0'>멤버 명단</p><span class='sm'>${M.length} / 8명</span></div><div style='display:flex;gap:4px;margin:8px 0 6px'>${CREWC.map((c,i)=>`<span style='flex:1;height:6px;border-radius:3px;background:${i<M.length?c:'rgba(255,255,255,.1)'}'></span>`).join('')}</div>${list}
<textarea id='cc' rows='3' style='width:100%;margin:12px 0 2px' placeholder='친구의 결과 코드(VL1.…)나 초대 메시지를 통째로 붙여넣으세요. 여러 명을 한 번에 넣어도 돼요'></textarea><div id='ccE' style='font-size:13px;color:var(--bad);min-height:18px'></div>
<div style='display:flex;gap:8px;flex-wrap:wrap'><button class='btn-main' id='ccAdd' style='min-height:44px;font-size:16px'>합류시키기</button>${mine&&!meIn?`<button id='ccMe'><i class='ti ti-user-plus'></i> 내 결과 넣기</button>`:''}<button id='ccInv'><i class='ti ti-send'></i> 내 초대 메시지 복사</button><button id='ccBack'><i class='ti ti-arrow-left'></i> 돌아가기</button></div>

${A?jo(A.html):`<div class='card' style='text-align:center'>${mascot('wink',80)}<p class='mut' style='margin:.4rem 0 0'>${M.length?'한 명만 더 합류하면 분석이 시작돼요.':'첫 멤버를 넣어 주세요.'} 친구에게 초대 메시지를 보내 보세요.</p></div>`}</div>`;
