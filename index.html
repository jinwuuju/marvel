<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="멍BTI 견종 감별소">
<meta property="og:description" content="내가 강아지였다면 어떤 견종일까? 산책 메이트, 앙숙, 찰떡 주인까지 알려 주는 30문항 검사">
<title>멍BTI 견종 감별소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Press+Start+2P&display=swap">
<style>
/* Layout: one column like a park signboard; stage in the middle, results as stacked picnic cards. Deliberate single sunny-day theme. */
:root{
  --sky:#dff3ff; --sky-2:#bfe6f8; --grass:#86cf6e; --grass-d:#4c9a5b;
  --cream:#fffaf0; --paper:#ffffff; --ink:#2d2a3a; --ink-2:#5c5870;
  --coral:#ff7a59; --coral-d:#d65a3c; --blue:#4a86e0; --blue-d:#2f62b0; --sun:#ffd65a; --leaf:#2fa77a;
  --f-disp:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-pix:"Press Start 2P",ui-monospace,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.65;min-height:100%;
  background:linear-gradient(180deg,var(--sky-2) 0,var(--sky) 380px,#e9f7e3 100%)}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

.intro{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.eyebrow{font-family:var(--f-pix);font-size:10px;letter-spacing:.1em;color:var(--coral-d)}
.title{font-size:clamp(44px,11vw,76px);line-height:1;color:var(--ink);text-shadow:4px 4px 0 var(--sun)}
.title em{font-style:normal;color:var(--coral)}
.lede{max-width:32em;color:var(--ink-2)}
.cast{width:100%;max-width:560px;image-rendering:pixelated;border:3px solid var(--ink);border-radius:10px;background:var(--grass)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:560px}
.rules div{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:10px 8px;font-size:13px;color:var(--ink-2);box-shadow:3px 3px 0 var(--ink)}
.rules b{display:block;font-family:var(--f-pix);font-size:14px;font-weight:400;color:var(--coral);margin-bottom:4px}
.btn{border:3px solid var(--ink);border-radius:12px;padding:12px 26px;font-family:var(--f-disp);font-size:21px;background:var(--coral);color:var(--paper);box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}

.hud{display:flex;align-items:center;gap:12px}
.hud .no{font-family:var(--f-disp);font-size:22px;white-space:nowrap}
.hud .no small{font-family:var(--f-pix);font-size:10px;color:var(--ink-2);margin-left:6px}
.pips{flex:1;display:grid;grid-template-columns:repeat(30,1fr);gap:2px;min-width:0}
.pips i{height:8px;background:var(--paper);border:1px solid #b9c7d3;border-radius:2px}
.pips i.done{background:var(--coral);border-color:var(--coral-d)}
.pips i.gate{border-color:var(--ink)}
.qcard{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:14px 18px;box-shadow:4px 4px 0 var(--ink);display:flex;gap:12px;align-items:flex-start}
.qcard .paw{flex:none;font-family:var(--f-pix);font-size:10px;color:var(--paper);background:var(--ink);border-radius:6px;padding:6px 6px 5px;margin-top:3px}
.qcard p{font-size:18px;line-height:1.5;font-family:var(--f-disp)}

.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.bubble{position:absolute;top:3%;width:40%;padding:8px 10px 10px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);text-align:left;
  font-family:var(--f-body);font-size:clamp(12px,2.6vw,15px);line-height:1.4;box-shadow:3px 3px 0 rgba(45,42,58,.35);transition:transform .15s,background .15s}
.bubble::after{content:"";position:absolute;bottom:-9px;left:calc(50% - 8px);width:12px;height:12px;background:inherit;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bubble.l{left:2%}.bubble.r{right:2%}
.bubble .tag{display:inline-block;font-family:var(--f-disp);font-size:13px;color:var(--paper);border-radius:6px;padding:0 7px;margin-bottom:3px}
.bubble.l .tag{background:var(--coral)}.bubble.r .tag{background:var(--blue)}
.bubble.hot{transform:translateY(-3px) scale(1.03)}
.bubble.l.hot{background:#fff0ea}.bubble.r.hot{background:#eaf2ff}
.bubble[disabled]{cursor:default}
.minibox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,250,240,.88);text-align:center;padding:16px}
.minibox h2{font-size:clamp(26px,6.5vw,36px);color:var(--coral-d)}
.minibox p{max-width:26em;font-size:14px}
.minibox .note{font-size:12px;color:var(--ink-2)}
.mhud{position:absolute;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;font-family:var(--f-disp);font-size:clamp(13px,3vw,16px);pointer-events:none}
.mhud span{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:0 8px}
.pad{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.pad button{min-width:84px;height:56px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--f-pix);font-size:16px;box-shadow:3px 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.pad button.on,.pad button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pad .act{background:var(--sun);font-family:var(--f-disp);font-size:20px}
.hint{text-align:center;font-size:13px;color:var(--ink-2)}

.res{display:flex;flex-direction:column;gap:18px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:18px;box-shadow:5px 5px 0 var(--ink)}
.portrait{width:168px;height:126px;image-rendering:pixelated;border-radius:12px;border:3px solid var(--ink);background:var(--grass)}
.meta{min-width:0;display:flex;flex-direction:column;gap:6px}
.code{font-family:var(--f-pix);font-size:clamp(20px,5.5vw,30px);color:var(--coral)}
.breed{font-size:clamp(32px,8vw,46px);line-height:1.05}
.breed small{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink-2);margin-top:4px}
.nick{font-family:var(--f-disp);font-size:19px;color:var(--blue-d)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:13px;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--cream)}
.energy{display:inline-flex;gap:3px;align-items:center;font-size:13px}
.energy i{width:10px;height:10px;border-radius:3px;background:#dfe5ea;border:1px solid var(--ink)}
.energy i.on{background:var(--coral)}

.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:5px 5px 0 var(--ink)}
.panel h3{font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel h3 .k{font-family:var(--f-pix);font-size:9px;letter-spacing:.06em;color:var(--paper);background:var(--ink);padding:5px 6px 4px;border-radius:5px}
.panel .sub{font-size:14px;color:var(--ink-2)}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits span{background:var(--sun);border:2px solid var(--ink);font-size:13px;padding:2px 10px;border-radius:8px}
.axes{display:flex;flex-direction:column;gap:10px}
.axis{display:grid;grid-template-columns:4.6em 1fr 4.6em;gap:8px;align-items:center;font-size:13px}
.axis .a{text-align:right}
.axis .on{color:var(--coral-d);font-weight:700}
.bar{position:relative;height:14px;background:#e6edf2;border:2px solid var(--ink);border-radius:7px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--coral)}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.4}
.pc{display:flex;justify-content:space-between;font-family:var(--f-pix);font-size:8px;color:var(--ink-2);margin-top:3px}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mate{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:12px;border-radius:12px;border:2px solid var(--ink);min-width:0}
.mate.good{background:#eaf8e4}.mate.bad{background:#fff0ea}
.mate canvas{width:84px;height:63px;image-rendering:pixelated;border-radius:8px;border:2px solid var(--ink);background:var(--grass)}
.mate.bad canvas{background:#f7c9b9}
.mate .nm{font-family:var(--f-disp);font-size:19px;line-height:1.2}
.mate .cd{font-family:var(--f-pix);font-size:9px;color:var(--ink-2)}
.mate p{grid-column:1/-1;font-size:14px}
.badge{display:inline-block;font-family:var(--f-disp);font-size:13px;padding:0 8px;border-radius:6px;color:var(--paper);margin-bottom:2px}
.badge.g{background:var(--leaf)}.badge.b{background:var(--coral-d)}
.owner{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border-radius:12px;border:2px solid var(--ink);min-width:0}
.owner.good{background:#eaf2ff}.owner.bad{background:#f3eefc}
.owner canvas{width:60px;height:96px;image-rendering:pixelated;border-radius:8px;border:2px solid var(--ink);background:var(--sky)}
.owner .nm{font-family:var(--f-disp);font-size:19px;line-height:1.25}
.owner .cd{font-family:var(--f-pix);font-size:11px;color:var(--blue-d)}
.owner p{font-size:14px;margin-top:4px}
.owner .tip{margin-top:8px;font-size:13px;background:var(--paper);border:2px dashed var(--ink-2);border-radius:8px;padding:6px 10px}
.alt .rk{font-family:var(--f-disp);font-size:14px;color:var(--coral-d)}
.share{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.toast{text-align:center;font-size:13px;color:var(--leaf);min-height:1.2em}
.urlbox{width:100%;font-size:12px;background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:8px}
.foot{height:14px;background:repeating-linear-gradient(90deg,var(--grass) 0 10px,var(--grass-d) 10px 12px);border-radius:7px;border:2px solid var(--ink)}
@media (max-width:540px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}.chips{justify-content:center}
  .pair{grid-template-columns:1fr}.rules{grid-template-columns:1fr}.qcard p{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <section id="intro" class="intro">
    <span class="eyebrow">MUNG-BTI · 16 BREEDS</span>
    <h1 class="title">멍BTI<br><em>견종 감별소</em></h1>
    <p class="lede">내가 강아지로 태어났다면 어떤 견종이었을까요? 픽셀 강아지를 데리고 30개의 갈림길을 지나면 내 견종, 함께 산책하기 좋은 친구, 만나면 으르렁대는 앙숙, 그리고 나와 잘 맞는 주인까지 알려 드려요.</p>
    <canvas id="cast" class="cast" width="160" height="48" aria-label="골든 리트리버, 웰시 코기, 시바견, 말티즈, 진돗개 픽셀 그림"></canvas>
    <div class="rules">
      <div><b>30</b>강아지를 걸려 답이 적힌 개집으로 쏙</div>
      <div><b>3</b>10문항마다 쉬어 가는 놀이 (결과와 무관)</div>
      <div><b>16</b>견종 + 산책 메이트 + 앙숙 + 찰떡 주인</div>
    </div>
    <button class="btn" id="start">산책 시작하기</button>
  </section>

  <section id="play" hidden>
    <div class="hud"><div class="no" id="qno"></div><div class="pips" id="pips" aria-hidden="true"></div></div>
    <div class="qcard"><span class="paw" id="qpaw">Q</span><p id="qtext"></p></div>
    <div class="stage">
      <canvas id="cv" width="160" height="120"></canvas>
      <button class="bubble l" id="optL"></button>
      <button class="bubble r" id="optR"></button>
      <div class="mhud" id="mhud" hidden><span id="mLeft"></span><span id="mRight"></span></div>
      <div class="minibox" id="minibox" hidden></div>
    </div>
    <div class="pad">
      <button id="btnL" aria-label="왼쪽으로">◀</button>
      <button id="btnAct" class="act" hidden></button>
      <button id="btnR" aria-label="오른쪽으로">▶</button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section id="result" class="res" hidden></section>
  <div class="foot" aria-hidden="true"></div>
</div>

<script>
// 30문항: E/I 8, S/N 7, T/F 7, J/P 8
window.QUESTIONS = [
{q:"산책을 나왔더니 공원에 처음 보는 강아지들이 잔뜩 모여 있어요!", a:["꼬리를 붕붕 흔들며 바로 무리 속으로 돌진!","E"], b:["멀찍이서 냄새부터 맡으며 분위기를 살펴요.","I"], w:1.2},
{q:"새 장난감이 생겼어요. 제일 먼저 하는 일은?", a:["일단 물고 흔들고 씹어 봐요. 직접 해 봐야 알죠!","S"], b:["이 안에 뭐가 숨어 있을까? 이리저리 굴려 보며 궁리해요.","N"]},
{q:"친구 강아지가 내 간식을 몰래 먹어 버렸어요.", a:["그건 내 거야! 단호하게 짖어서 확실히 해 둬요.","T"], b:["배가 많이 고팠나 봐… 그냥 넘어가 줘요.","F"]},
{q:"매일 가는 산책 시간이 다가와요.", a:["5분 전부터 현관 앞에 앉아 대기해요.","J"], b:["주인이 목줄을 들면 그제야 알아채요.","P"]},
{q:"집에 손님이 왔어요!", a:["현관까지 달려가 온몸으로 환영해요.","E"], b:["방 구석에서 지켜보다가 나중에 슬쩍 다가가요.","I"]},
{q:"산책길에서 처음 맡아 보는 냄새가 나요.", a:["어디서 온 냄새일까? 머릿속으로 모험을 떠나요.","N"], b:["누구 냄새인지 하나하나 꼼꼼히 확인해요.","S"]},
{q:"훈련 중에 '앉아'를 틀렸어요.", a:["뭐가 틀렸는지 다시 해 보며 방법을 찾아요.","T"], b:["주인 표정이 실망한 것 같아 마음이 쓰여요.","F"]},
{q:"내 잠자리는요?", a:["언제나 같은 자리, 같은 방석이어야 해요.","J"], b:["오늘은 소파, 내일은 이불 위. 그날 기분 따라!","P"]},
{q:"신나게 놀고 난 뒤 쉬는 방법은?", a:["친구들이랑 엉켜서 다 같이 꾸벅꾸벅.","E"], b:["혼자 내 집에 쏙 들어가 푹 쉬어요.","I"]},
{q:"주인이 새로운 개인기를 가르쳐 줘요.", a:["시범 보여 준 대로 차근차근 따라 해요.","S"], b:["대충 감 잡고 나만의 방식으로 해 봐요.","N"]},

{q:"옆에서 다른 강아지가 낑낑대며 울고 있어요.", a:["다가가서 옆에 꼭 붙어 앉아 줘요.","F"], b:["무슨 일인지 주변부터 살펴 원인을 찾아요.","T"]},
{q:"산책 코스가 갑자기 바뀌었어요.", a:["오, 새로운 길이다! 신나요.","P"], b:["왜 평소 길로 안 가요? 그 자리에 버티고 서요.","J"]},
{q:"애견 카페에 놀러 갔어요.", a:["카페에 있는 모든 강아지와 인사를 나눠요.","E"], b:["마음에 드는 친구 하나랑만 놀아요.","I"]},
{q:"간식 숨겨 놓고 찾기 놀이를 해요.", a:["코를 바닥에 대고 구석구석 차근차근 훑어요.","S"], b:["주인이 숨길 만한 곳을 짐작해서 바로 가요.","N"]},
{q:"공놀이 시합에서 졌어요.", a:["다음엔 이긴다! 더 빨리 뛰는 법을 연구해요.","T"], b:["이긴 친구에게 꼬리 흔들며 축하해 줘요.","F"]},
{q:"밥그릇에 사료가 담겼어요.", a:["정해진 만큼 한 번에 깔끔하게 비워요.","J"], b:["먹다 놀다 먹다 놀다, 하루 종일 조금씩.","P"]},
{q:"주인이 외출했다 돌아왔어요!", a:["짖고 뛰고 빙글빙글! 온 동네가 알게 반겨요.","E"], b:["살랑살랑 꼬리 치며 조용히 다가가 기대요.","I"]},
{q:"창밖을 바라볼 때 나는…", a:["저 구름은 뼈다귀 모양이네… 하며 멍때려요.","N"], b:["지나가는 사람, 차, 고양이를 하나하나 지켜봐요.","S"]},
{q:"산책 중에 주인이 다른 강아지를 쓰다듬어요.", a:["그럴 수도 있죠. 별로 신경 안 써요.","T"], b:["서운해서 주인 다리에 몸을 비비며 관심을 끌어요.","F"]},
{q:"내 장난감들은 어디에 있나요?", a:["늘 바구니 안에 모아 둬요.","J"], b:["온 집 안에 흩어져 있어요. 다 내 영역이니까요.","P"]},

{q:"강아지 운동회에 나가게 됐어요.", a:["관중이 환호할수록 힘이 더 나요!","E"], b:["사람이 많으면 긴장돼서 실력이 덜 나와요.","I"]},

  }

    set(x,y, P.includes('tailTip')&&i===tl.length-1?c2:c1); });

  }
  if(P.includes('patch')){ for(let y=hy0;y<=hy0+2;y++)for(let x=hx0;x<=hx0+3;x++) set(x,y,c3); }

  for(let x=hx1+1;x<=hx1+sn;x++){ set(x,hy1-1,snc); set(x,hy1,snc); }

    case 'bigprick': [[0,-1],[1,-1],[3,-1],[0,-2],[1,-2],[2,-2],[0,-3],[1,-3],[0,-4]].forEach(([a,b])=>set(hx0+a,hy0+b,ec)); set(hx0+2,hy0-1,pink); break;

    case 'fold': [[1,-1],[2,-1],[3,-1],[4,0]].forEach(([a,b])=>set(hx0+a,hy0+b,ec)); break;
    case 'flop': for(let y=hy0;y<=hy0+d.hs-2;y++){set(hx0+1,y,ec);set(hx0+2,y,ec);} set(hx0+1,hy0-1,ec); break;

  }

  if(d.fluffy){ const fc=c1;
    for(let x=bx0+1;x<bx1-2;x+=3) if(!has(x,yb0-1-(d.round?1:0))) set(x,yb0-1-(d.round?1:0), (P.includes('saddle')||P.includes('tri'))?c3:fc);

  }

  let minx=1e9,maxx=-1e9,miny=1e9; m.forEach((c,k)=>{const [x,y]=k.split(',').map(Number); if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y;});

{ title:"기다려! 먹어!", icon:"🥣",

    // 말풍선
    if(s.phase!=="res"){ const go=s.phase==="go", w=go?34:44; ctx.fillStyle="#16131f"; ctx.fillRect(18,58,w+2,16); ctx.fillStyle=go?"#ffd65a":"#fffaf0"; ctx.fillRect(19,59,w,14); ctx.fillRect(28,73,4,3);
      ctx.font="bold 9px sans-serif"; ctx.textAlign="center"; ctx.fillStyle=go?"#c9523a":"#2d2a3a"; ctx.fillText(s.word,19+w/2,69); }
    if(s.mt>0) label(ctx,s.msg,100,72,s.msg.includes("성공")?"#2fa77a":"#c9523a"); },
  hud(){ return ["도전 "+Math.min(this.s.round+1,6)+" / 6","성공 "+this.s.score]; },
  end(){ const n=this.s.score, b=this.s.best; return {score:n+" / 6 성공", line:(b!=null?"최고 반응 속도 "+b+"ms. ":"")+(n>=5?"훈련소 수석 졸업감이에요!":n>=3?"제법 의젓한 강아지예요.":"간식 앞에선 참을 수가 없어요.")}; }
},
{ title:"원반 점프", icon:"🥏",
  desc:"공원 위로 원반이 날아가요! 좌우로 움직이고 '점프' 버튼(또는 스페이스)으로 뛰어올라 원반을 물어요. 20초 동안 이어져요.",
  label:"점프", move:true,
  init(){ this.s={t:20,discs:[],sp:0.4,score:0,vy:0,air:false}; this.pc={x:80,y:G.FEET,face:1,frame:0,ft:0}; this.done=false; },
  act(){ const s=this.s; if(s.air)return; s.air=true; s.vy=-125; },
  update(dt,inp){ const s=this.s, pc=this.pc; s.t-=dt; if(s.t<=0){s.t=0;this.done=true;return;}
    walk(pc,inp,dt,80);
    if(s.air){ s.vy+=340*dt; pc.y+=s.vy*dt; pc.frame=1; if(pc.y>=G.FEET){pc.y=G.FEET;s.air=false;} }
    s.sp-=dt; if(s.sp<=0){ s.sp=1.1-0.45*(1-s.t/20); const L=Math.random()<0.5;
      s.discs.push({x:L?-6:166,vx:(L?1:-1)*(38+Math.random()*26+(20-s.t)*1.2),y0:76+Math.random()*16,ph:Math.random()*6,c:["#ff7a59","#4a86e0","#ffd65a"][Math.floor(Math.random()*3)]}); }
    const hx=pc.x+pc.face*6, hy=pc.y-9;
    s.discs=s.discs.filter(d=>{ d.x+=d.vx*dt; d.ph+=dt*4; d.y=d.y0+Math.sin(d.ph)*3;
      if(Math.abs(d.x-hx)<8&&Math.abs(d.y-hy)<6){ s.score++; G.puff(d.x,d.y,12,[d.c,"#fff"]); return false; }
      return d.x>-10&&d.x<170; }); },
  draw(ctx,t){ const s=this.s;
    s.discs.forEach(d=>{ const x=Math.round(d.x),y=Math.round(d.y); ctx.fillStyle="#16131f"; ctx.fillRect(x-4,y-2,9,4); ctx.fillStyle=d.c; ctx.fillRect(x-3,y-1,7,2); ctx.fillStyle="#fff"; ctx.fillRect(x-1,y-1,2,1); });
    const pc=this.pc; ctx.fillStyle="rgba(40,80,40,0.25)"; ctx.fillRect(Math.round(pc.x)-7,G.FEET,15,2);
    G.drawDog(ctx,pc.x,pc.y,G.PUP,pc.frame,pc.face,1,Math.floor(t*8)%2); },
  hud(){ return ["물어 온 원반 "+this.s.score,"남은 시간 "+Math.ceil(this.s.t)]; },
  end(){ const n=this.s.score; return {score:"원반 "+n+"개", line:n>=12?"원반 대회 금메달감이에요!":n>=6?"공원의 인기 스타예요.":"원반이 머리 위로 휙휙 지나갔어요."}; }
}
];
})();

</script>
<script>
(function(){
const G=window.G, Q=window.QUESTIONS, T=window.TYPES;
const SHARE_URL="";
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const BG=G.buildBG();
let mode="intro", idx=0, ans=[], mini=null, miniN=0, enterT=0, enterSide=null;
const pc={x:80,y:G.FEET,face:1,frame:0,ft:0,alpha:1,target:null};
const inp={l:false,r:false};

const pips=$('pips'); for(let i=0;i<30;i++){const e=document.createElement('i'); if(i%10===9)e.className='gate'; pips.appendChild(e);}
const setPips=()=>[...pips.children].forEach((e,i)=>e.classList.toggle('done',i<idx));

// 인트로
const cast=$('cast'), cc=cast.getContext('2d');
const CAST=["ENFJ","ENFP","INTJ","INFP","ISTJ"];
function drawCast(t){
  cc.fillStyle="#bfe6f8"; cc.fillRect(0,0,160,48); cc.fillStyle="#86cf6e"; cc.fillRect(0,34,160,14);
  cc.fillStyle="#f0d9a8"; cc.fillRect(0,38,160,8); cc.fillStyle="#d9bb84"; cc.fillRect(0,38,160,1);
  CAST.forEach((k,i)=>{ const x=16+i*32, hop=Math.round(Math.max(0,Math.sin(t*4+i*1.3))*2);
    G.drawDog(cc,x,44-hop,T[k].dog,0,i%2?-1:1,1,Math.floor(t*6+i)%2); });
}

function setBubble(el,tag,txt){ el.innerHTML=''; const s=document.createElement('span'); s.className='tag'; s.textContent=tag; el.appendChild(s); el.appendChild(document.createElement('br')); el.appendChild(document.createTextNode(txt)); }
function showQ(){
  mode="quiz"; const q=Q[idx];
  $('qno').innerHTML='Q'+(idx+1)+'<small>/ 30</small>'; $('qpaw').textContent='Q'+(idx+1);
  $('qtext').textContent=q.q;
  setBubble($('optL'),"빨간 집",q.a[0]); setBubble($('optR'),"파란 집",q.b[0]);
  $('optL').hidden=$('optR').hidden=false; $('optL').disabled=$('optR').disabled=false;
  Object.assign(pc,{x:80,y:G.FEET,alpha:1,target:null,frame:0});
  G.puff(80,G.FEET-8,12,["#ffffff","#ffd65a","#ff7a59"]);
  $('btnAct').hidden=true; $('btnL').hidden=$('btnR').hidden=false;
  $('hint').textContent="◀ ▶ 버튼이나 방향키로 강아지를 움직여 고른 답의 개집에 쏙 들여보내요. 말풍선을 눌러도 달려가요.";
  setPips();
}
function choose(c){ if(mode!=="quiz")return; ans[idx]=c; mode="enter"; enterT=0; enterSide=c; pc.target=null; inp.l=inp.r=false; $('optL').disabled=$('optR').disabled=true; }
function nextQ(){ idx++; setPips(); if(idx%10===0) startMini(idx/10-1); else showQ(); }

// 놀이
const box=$('minibox');
function startMini(n){
  miniN=n; mini=G.MINI[n]; mode="miniIntro";
  $('optL').hidden=$('optR').hidden=true; $('mhud').hidden=true;
  $('qno').innerHTML='쉬는 시간<small>'+(n+1)+' / 3</small>'; $('qpaw').textContent='★';
  $('qtext').textContent=(n===2?"30문항 완주! 결과를 보기 전에 ":"10문항 통과! ")+"잠깐 놀다 가요. 놀이 점수는 결과에 들어가지 않아요.";
  box.innerHTML='<h2>'+mini.title+'</h2><p>'+mini.desc+'</p><p class="note">결과와 상관없는 놀이예요</p><div class="pad"><button class="btn" id="mgo">놀이 시작</button><button class="btn ghost" id="mskip">건너뛰기</button></div>';
  box.hidden=false;
  $('mgo').onclick=()=>{ mini.init(); box.hidden=true; $('mhud').hidden=false; mode="mini";
    $('btnAct').hidden=!mini.label; $('btnAct').textContent=mini.label||""; $('btnL').hidden=$('btnR').hidden=!mini.move;
    $('hint').textContent=mini.move?(mini.label?"◀ ▶로 움직이고 '"+mini.label+"' 버튼이나 스페이스를 눌러요.":"◀ ▶ 버튼이나 방향키로 움직여요."):"'"+mini.label+"' 버튼이나 스페이스를 눌러요.";
    $('mgo').blur(); };
  $('mskip').onclick=afterMini; $('mgo').focus({preventScroll:true});
}
function endMini(){ mode="miniEnd"; const r=mini.end(); $('mhud').hidden=true;
  box.innerHTML='<h2>'+r.score+'</h2><p>'+r.line+'</p><p class="note">이 점수는 결과에 들어가지 않아요</p><button class="btn" id="mnext">'+(miniN===2?"결과 보러 가기":"다음 질문으로")+'</button>';
  box.hidden=false; $('mnext').onclick=afterMini; $('mnext').focus({preventScroll:true}); }
function afterMini(){ box.hidden=true; $('mhud').hidden=true; mini=null; G.parts=[]; if(miniN===2) showResult(compute()); else showQ(); }

// 입력
function hold(btn,key){ const on=e=>{e.preventDefault();inp[key]=true;btn.classList.add('on');pc.target=null;}, off=()=>{inp[key]=false;btn.classList.remove('on');};
  btn.addEventListener('pointerdown',on); ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,off)); }
hold($('btnL'),'l'); hold($('btnR'),'r');
$('btnAct').addEventListener('pointerdown',e=>{e.preventDefault();doAct();});
function doAct(){ if(mode==="mini"&&mini&&mini.act) mini.act(); }
$('optL').onclick=()=>{ if(mode==="quiz") pc.target=G.GL-4; };
$('optR').onclick=()=>{ if(mode==="quiz") pc.target=G.GR+4; };
const playing=()=>mode==="quiz"||mode==="mini";
addEventListener('keydown',e=>{ if(!playing())return; const k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A"){inp.l=true;pc.target=null;e.preventDefault();}
  else if(k==="ArrowRight"||k==="d"||k==="D"){inp.r=true;pc.target=null;e.preventDefault();}
  else if((k===" "||k==="ArrowUp")&&mode==="mini"){ if(!e.repeat) doAct(); e.preventDefault(); } });
addEventListener('keyup',e=>{ const k=e.key; if(k==="ArrowLeft"||k==="a"||k==="A")inp.l=false; if(k==="ArrowRight"||k==="d"||k==="D")inp.r=false; });

// 루프
function update(dt){
  G.updParts(dt);
  if(mode==="quiz"){
    let d=(inp.r?1:0)-(inp.l?1:0); if(pc.target!=null) d=Math.sign(pc.target-pc.x);
    pc.x=Math.max(10,Math.min(150,pc.x+d*66*dt));
    if(d){pc.face=d;pc.ft+=dt;pc.frame=[0,1,0,2][Math.floor(pc.ft*10)%4];}else pc.frame=0;
    $('optL').classList.toggle('hot',pc.x<62); $('optR').classList.toggle('hot',pc.x>98);
    if(pc.x<=G.GL+2) choose('a'); else if(pc.x>=G.GR-2) choose('b');
  } else if(mode==="enter"){
    enterT+=dt; const cx=enterSide==='a'?G.GL:G.GR; pc.x+=(cx-pc.x)*Math.min(1,dt*10);
    pc.y=G.FEET-enterT*26; pc.alpha=Math.max(0,1-enterT/0.5); pc.ft+=dt; pc.frame=[0,1,0,2][Math.floor(pc.ft*10)%4];
    if(enterT>0.62){ $('optL').classList.remove('hot'); $('optR').classList.remove('hot'); nextQ(); }
  } else if(mode==="mini"){ mini.update(dt,inp); if(mini.done) endMini(); else { const h=mini.hud(); $('mLeft').textContent=h[0]; $('mRight').textContent=h[1]; } }
}
function draw(t){
  if(mode==="intro"){ drawCast(t); return; }
  if(mode==="result") return;
  ctx.drawImage(BG,0,0); G.drawSky(ctx,t);
  if(mode==="quiz"||mode==="enter"){
    [[G.GL,pc.x<62||(enterSide==='a'&&mode==="enter")],[G.GR,pc.x>98||(enterSide==='b'&&mode==="enter")]].forEach(([cx,on])=>{
      if(!on) return; ctx.fillStyle='rgba(255,214,90,'+(0.45+0.25*Math.sin(t*8)).toFixed(2)+')'; ctx.fillRect(cx-4,88,9,10); ctx.fillRect(cx-3,86,7,2);
      if(mode==="quiz"){ const by=Math.round(56+Math.sin(t*6)*1.5); ctx.fillStyle="#16131f"; ctx.fillRect(cx-3,by-1,7,1); ctx.fillStyle="#ffd65a"; ctx.fillRect(cx-2,by,5,1); ctx.fillRect(cx-1,by+1,3,1); ctx.fillRect(cx,by+2,1,1); } });
    ctx.fillStyle='rgba(40,80,40,0.25)'; ctx.fillRect(Math.round(pc.x)-7,G.FEET,15,2);
    G.drawDog(ctx,pc.x,pc.y,G.PUP,pc.frame,pc.face,pc.alpha,Math.floor(t*8)%2);
  } else if(mini && (mode==="mini"||mode==="miniEnd")) mini.draw(ctx,t);
  G.drawParts(ctx);
}
let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; update(dt); draw(now/1000); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// 채점
const AX=[["E","I","외향","내향"],["S","N","감각","직관"],["T","F","사고","감정"],["J","P","계획","즉흥"]];
function compute(){
  const sc={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  Q.forEach((q,i)=>{ const c=ans[i]; if(c) sc[q[c][1]]+=q.w||1; });
  const pct=AX.map(([a,b])=>{const tt=sc[a]+sc[b]; return tt?sc[a]/tt:0.5;});
  const all=[];
  for(const a of "EI")for(const b of "SN")for(const c of "TF")for(const d of "JP"){ const code=a+b+c+d;
    all.push({code,m:[...code].reduce((s,L,i)=>s+(L===AX[i][0]?pct[i]:1-pct[i]),0)/4}); }
  all.sort((x,y)=>y.m-x.m); return {pct,rank:all};
}

// 결과
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function dogCanvas(d,w,h,face){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  g.fillStyle="rgba(40,80,40,0.18)"; g.fillRect(Math.round(w/2-9),h-4,19,2); G.drawDog(g,w/2,h-4,d,0,face||1,1,0); return c; }
function ownerCanvas(code){ const c=document.createElement('canvas'); c.width=20; c.height=32; G.drawOwner(c.getContext('2d'),5,10,code); return c; }
function mateCard(item,kind){ const t=T[item.c];
  return '<div class="mate '+kind+'"><div data-dog="'+item.c+'" data-face="'+(kind==='bad'?-1:1)+'"></div><div style="min-width:0"><span class="badge '+(kind==='good'?'g':'b')+'">'+(kind==='good'?'산책 메이트':'으르렁 주의')+'</span><div class="nm">'+esc(t.breed)+'</div><div class="cd">'+item.c+'</div></div><p>'+esc(item.why)+'</p></div>'; }
function ownerCard(o,kind){
  return '<div class="owner '+kind+'"><div data-owner="'+o.c+'"></div><div style="min-width:0"><span class="badge '+(kind==='good'?'g':'b')+'">'+(kind==='good'?'찰떡 주인':'안 맞는 주인')+'</span><div class="cd">'+o.c+' 주인</div><div class="nm">'+esc(o.t)+'</div><p>'+esc(o.why)+'</p>'+(o.tip?'<p class="tip"><b>그래도 함께라면</b> · '+esc(o.tip)+'</p>':'')+'</div></div>'; }
function shareBase(){ return SHARE_URL || location.href.split('#')[0]; }
function showResult(res,shared){
  mode="result"; $('intro').hidden=true; $('play').hidden=true;
  const code=res.rank[0].code, t=T[code], el=$('result'); el.hidden=false;
  const energy='<span class="energy">활동량 '+[1,2,3,4,5].map(i=>'<i class="'+(i<=t.energy?'on':'')+'"></i>').join('')+'</span>';
  const axes=shared?'':'<div class="panel"><h3><span class="k">GRAPH</span>내 성향 그래프</h3><div class="axes">'+AX.map(([a,b,an,bn],i)=>{const p=res.pct[i];
    return '<div class="axis"><span class="a '+(p>=0.5?'on':'')+'">'+an+' '+a+'</span><div><div class="bar"><i style="width:'+Math.round(p*100)+'%"></i></div><div class="pc"><span>'+Math.round(p*100)+'%</span><span>'+Math.round((1-p)*100)+'%</span></div></div><span class="'+(p<0.5?'on':'')+'">'+b+' '+bn+'</span></div>';}).join('')+'</div></div>';
  const alts=shared?'':'<div class="panel"><h3><span class="k">2ND · 3RD</span>내 안에 숨은 다른 견종</h3><p class="sub">가장 아슬아슬했던 성향이 반대로 기울었다면 이 친구들이었을 거예요.</p><div class="pair">'+
    res.rank.slice(1,3).map((o,i)=>{const a=T[o.code]; return '<div class="mate good alt"><div data-dog="'+o.code+'" data-face="1"></div><div style="min-width:0"><div class="rk">'+(i+2)+'순위 · 닮은 정도 '+Math.round(o.m*100)+'%</div><div class="nm">'+esc(a.breed)+'</div><div class="cd">'+o.code+' · '+esc(a.nick)+'</div></div><p>'+esc(a.desc.split('. ')[0])+'.</p></div>';}).join('')+'</div></div>';
  el.innerHTML=(shared?'<p class="hint" style="font-size:15px">친구가 보낸 결과예요. 나는 어떤 강아지일까요?</p>':'')+
   '<div class="hero"><div data-hero></div><div class="meta"><span class="eyebrow">나는 강아지로 태어났다면</span><div class="code">'+code+'</div>'+
   '<h2 class="breed">'+esc(t.breed)+'<small>'+esc(t.en)+'</small></h2><div class="nick">'+esc(t.nick)+'</div>'+
   '<div class="chips"><span class="chip">'+esc(t.size)+'</span>'+energy+'</div></div></div>'+
   '<div class="panel"><h3><span class="k">TYPE</span>어떤 강아지인가요</h3><p>'+esc(t.desc)+'</p><div class="traits">'+t.traits.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div></div>'+
   axes+
   '<div class="panel"><h3><span class="k">WALK</span>같이 산책하기 좋은 친구</h3><div class="pair">'+t.walk.map(w=>mateCard(w,'good')).join('')+'</div></div>'+
   '<div class="panel"><h3><span class="k">GRRR</span>만나면 으르렁대는 앙숙</h3><div class="pair">'+t.growl.map(w=>mateCard(w,'bad')).join('')+'</div></div>'+
   '<div class="panel"><h3><span class="k">OWNER</span>나와 맞는 주인, 안 맞는 주인</h3><div class="pair">'+ownerCard(t.good,'good')+ownerCard(t.bad,'bad')+'</div></div>'+
   alts+
   '<div class="panel"><h3><span class="k">SHARE</span>친구에게 보내기</h3><div class="share">'+(shared?'':'<button class="btn" id="cpRes">내 결과 링크 복사</button>')+'<button class="btn '+(shared?'':'ghost')+'" id="cpTest">검사 링크 복사</button></div>'+
   '<input class="urlbox" id="urlbox" readonly aria-label="공유 링크"><p class="toast" id="toast"></p><div class="share"><button class="btn ghost" id="again">'+(shared?'나도 해 보기':'다시 해 보기')+'</button></div></div>'+
   '<p class="hint">재미로 보는 검사예요. MBTI를 빌린 놀이일 뿐 공식 성격검사가 아니고, 견종 성격도 개체마다 달라요.</p>';
  const hc=dogCanvas(t.dog,40,30,1); hc.className='portrait'; el.querySelector('[data-hero]').replaceWith(hc);
  el.querySelectorAll('[data-dog]').forEach(d=>d.replaceWith(dogCanvas(T[d.dataset.dog].dog,28,21,+d.dataset.face)));
  el.querySelectorAll('[data-owner]').forEach(d=>d.replaceWith(ownerCanvas(d.dataset.owner)));
  const resUrl=shareBase()+'#'+code, testUrl=shareBase();
  $('urlbox').value=shared?testUrl:resUrl;
  const copy=(u,msg)=>{ $('urlbox').value=u; try{ navigator.clipboard.writeText(u).then(()=>$('toast').textContent=msg,()=>{ $('urlbox').select(); $('toast').textContent="복사가 막혔어요. 위 주소를 길게 눌러 복사해 주세요."; }); }catch(e){ $('urlbox').select(); } };
  if($('cpRes')) $('cpRes').onclick=()=>copy(resUrl,"결과 링크를 복사했어요!");
  $('cpTest').onclick=()=>copy(testUrl,"검사 링크를 복사했어요!");
  $('again').onclick=()=>{ el.hidden=true; el.innerHTML=''; try{history.replaceState(null,'',location.pathname+location.search);}catch(e){} start(); };
  scrollTo({top:0,behavior:'smooth'});
}
function start(){ idx=0; ans=[]; $('intro').hidden=true; $('result').hidden=true; $('play').hidden=false; showQ(); }
$('start').onclick=start;
const h=(location.hash||'').slice(1).toUpperCase();
if(T[h]) showResult({rank:[{code:h,m:1}]},true);
})();

</script>
